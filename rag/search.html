<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能搜索 · 行业数据百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
    }

    /* 背景装饰 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(167, 139, 250, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* 主内容 */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 24px 60px;
      position: relative;
      z-index: 1;
    }

    /* 搜索头部 */
    .search-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .search-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* 搜索框 */
    .search-box {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 16px 56px 16px 20px;
      font-size: 16px;
      font-family: inherit;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      color: var(--text);
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-btn:hover {
      transform: translateY(-50%) scale(1.05);
    }

    /* 搜索建议 */
    .search-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .suggestion-tag {
      padding: 6px 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .suggestion-tag:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* 模式切换 */
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .mode-tab {
      padding: 8px 20px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      color: var(--text);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    /* 搜索结果 */
    .results-section {
      margin-top: 48px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .results-count {
      font-size: 14px;
      color: var(--text-muted);
    }

    .results-count strong {
      color: var(--accent);
    }

    .result-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .result-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.1);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .result-score {
      font-size: 12px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 20px;
      font-weight: 500;
    }

    .result-category {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      background: rgba(167, 139, 250, 0.1);
      color: var(--accent-2);
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .result-summary {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 问答模式 */
    .answer-section {
      margin-top: 48px;
    }

    .answer-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .answer-label {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .answer-text {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
    }

    .answer-sources {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
    }

    .sources-title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .source-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .source-title {
      color: var(--text);
    }

    .source-score {
      color: var(--accent);
      font-size: 12px;
    }

    /* 加载状态 */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--glass-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* 统计信息 */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--glass-border);
    }

    .stat-item {
      text-align: center;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }

      .search-title {
        font-size: 28px;
      }

      .container {
        padding: 80px 16px 40px;
      }

      .stats-bar {
        gap: 24px;
      }
    }
  </style>
</head>

  <div class="container">
    <!-- 搜索头部 -->
    <div class="search-header">
      <h1 class="search-title">智能搜索</h1>
      <p class="search-subtitle">基于语义理解的行业知识检索，用自然语言找到你想要的答案</p>
      
      <!-- 模式切换 -->
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="search">🔍 语义搜索</button>
        <button class="mode-tab" data-mode="ask">💡 智能问答</button>
      </div>

      <!-- 搜索框 -->
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="输入你想了解的内容，比如：SaaS的核心指标有哪些？">
        <button class="search-btn" id="searchBtn">🔍</button>
      </div>

      <!-- 搜索建议 -->
      <div class="search-suggestions">
        <span class="suggestion-tag" data-query="SaaS核心指标">SaaS核心指标</span>
        <span class="suggestion-tag" data-query="游戏行业留存率">游戏行业留存率</span>
        <span class="suggestion-tag" data-query="什么是北极星指标">什么是北极星指标</span>
        <span class="suggestion-tag" data-query="RFM模型怎么用">RFM模型怎么用</span>
        <span class="suggestion-tag" data-query="直播电商UV价值">直播电商UV价值</span>
      </div>
    </div>

    <!-- 结果区域 -->
    <div id="resultsArea">
      <!-- 初始状态：统计信息 -->
      <div class="stats-bar" id="statsBar">
        <div class="stat-item">
          <div class="stat-num" id="totalChunks">-</div>
          <div class="stat-label">知识条目</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">12</div>
          <div class="stat-label">行业覆盖</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">140+</div>
          <div class="stat-label">核心指标</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';
    let currentMode = 'search';

    // 初始化（script在页面底部，DOM已加载，直接执行）
    loadStats();
    bindEvents();

    // 绑定事件
    function bindEvents() {
      // 搜索按钮
      document.getElementById('searchBtn').addEventListener('click', doSearch);
      
      // 回车搜索
      document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          doSearch();
        }
      });

      // 模式切换
      document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentMode = this.dataset.mode;
          
          // 更新placeholder
          const input = document.getElementById('searchInput');
          if (currentMode === 'search') {
            input.placeholder = '输入你想了解的内容，比如：SaaS的核心指标有哪些？';
          } else {
            input.placeholder = '问一个问题，比如：什么是LTV/CAC？健康值是多少？';
          }
        });
      });

      // 搜索建议
      document.querySelectorAll('.suggestion-tag').forEach(tag => {
        tag.addEventListener('click', function() {
          document.getElementById('searchInput').value = this.dataset.query;
          doSearch();
        });
      });
    }

    // 加载统计信息
    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/stats`);
        const data = await res.json();
        document.getElementById('totalChunks').textContent = data.total_chunks || '-';
      } catch (e) {
        document.getElementById('totalChunks').textContent = '未连接';
      }
    }

    // 执行搜索
    async function doSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const resultsArea = document.getElementById('resultsArea');
      
      // 显示加载状态
      resultsArea.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>正在搜索中...</p>
        </div>
      `;

      try {
        if (currentMode === 'search') {
          await doSemanticSearch(query);
        } else {
          await doAsk(query);
        }
      } catch (e) {
        resultsArea.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <p>搜索失败：${e.message}</p>
            <p style="font-size: 13px; margin-top: 8px;">请确保后端服务已启动 (python app.py)</p>
          </div>
        `;
      }
    }

    // 语义搜索
    async function doSemanticSearch(query) {
      const res = await fetch(`${API_BASE}/search`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, n_results: 5 })
      });

      const data = await res.json();
      const resultsArea = document.getElementById('resultsArea');

      if (data.results.length === 0) {
        resultsArea.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p>没有找到相关结果</p>
          </div>
        `;
        return;
      }

      let html = `
        <div class="results-section">
          <div class="results-header">
            <div class="results-count">找到 <strong>${data.total}</strong> 个相关结果</div>
          </div>
      `;

      data.results.forEach((result, index) => {
        const similarityPercent = (result.similarity * 100).toFixed(1);
        html += `
          <div class="result-card" onclick="window.open('${result.url}', '_blank')">
            <div class="result-header">
              <h3 class="result-title">${result.title}</h3>
              <span class="result-score">相似度 ${similarityPercent}%</span>
            </div>
            <span class="result-category">${result.category}</span>
            <p class="result-summary">${result.summary}</p>
          </div>
        `;
      });

      html += '</div>';
      resultsArea.innerHTML = html;
    }

    // 智能问答
    async function doAsk(question) {
      const res = await fetch(`${API_BASE}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, n_results: 3 })
      });

      const data = await res.json();
      const resultsArea = document.getElementById('resultsArea');

      let html = `
        <div class="answer-section">
          <div class="answer-card">
            <div class="answer-label">💡 回答</div>
            <div class="answer-text">${escapeHtml(data.answer)}</div>
            
            <div class="answer-sources">
              <div class="sources-title">📚 参考来源</div>
      `;

      data.sources.forEach((source, index) => {
        const similarityPercent = (source.similarity * 100).toFixed(1);
        html += `
          <div class="source-item" onclick="window.open('${source.url}', '_blank')" style="cursor: pointer;">
            <span class="source-title">${index + 1}. ${source.title}</span>
            <span class="source-score">${similarityPercent}%</span>
          </div>
        `;
      });

      html += `
            </div>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 16px;">
              ${data.note || ''}
            </p>
          </div>
        </div>
      `;

      resultsArea.innerHTML = html;
    }

    // HTML转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
  <script src="../common.js"></script>
