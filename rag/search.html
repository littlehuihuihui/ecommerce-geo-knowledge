<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能搜索 · 行业数据百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="../common.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
    }

    /* 背景装饰 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(167, 139, 250, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* 主内容 */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 24px 60px;
      position: relative;
      z-index: 1;
    }

    /* 搜索头部 */
    .search-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .search-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* 搜索框 */
    .search-box {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 16px 56px 16px 20px;
      font-size: 16px;
      font-family: inherit;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      color: var(--text);
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-btn:hover {
      transform: translateY(-50%) scale(1.05);
    }

    /* 搜索建议 */
    .search-suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .suggestion-tag {
      padding: 6px 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .suggestion-tag:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* 模式切换 */
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .mode-tab {
      padding: 8px 20px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      color: var(--text);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    /* 搜索结果 */
    .results-section {
      margin-top: 48px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .results-count {
      font-size: 14px;
      color: var(--text-muted);
    }

    .results-count strong {
      color: var(--accent);
    }

    .result-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .result-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.1);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .result-score {
      font-size: 12px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 20px;
      font-weight: 500;
    }

    .result-category {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      background: rgba(167, 139, 250, 0.1);
      color: var(--accent-2);
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .result-summary {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 问答模式 */
    .answer-section {
      margin-top: 48px;
    }

    .answer-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }

    .answer-label {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .answer-text {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
    }

    .answer-sources {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
    }

    .sources-title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .source-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .source-title {
      color: var(--text);
    }

    .source-score {
      color: var(--accent);
      font-size: 12px;
    }

    /* 加载状态 */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--glass-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* 统计信息 */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--glass-border);
    }

    .stat-item {
      text-align: center;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }

      .search-title {
        font-size: 28px;
      }

      .container {
        padding: 80px 16px 40px;
      }

      .stats-bar {
        gap: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- 统一导航栏 -->
    <nav class="encyclopedia-nav">
    <a href="../index.html" class="nav-logo">
      <span class="nav-logo-icon">百</span>
      <span>行业数据百科</span>
    </a>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">首页</a>
      <a href="../metrics.html" class="nav-link">指标字典</a>
      <a href="../methodology.html" class="nav-link">方法论</a>
      <a href="../knowledge-graph.html" class="nav-link">知识图谱</a>
      <a href="../interview.html" class="nav-link">业务问题拆解</a>

      <a href="../frameworks.html" class="nav-link">知识框架</a>
<a href="../rag/search.html" class="nav-link active">✨ 智能搜索</a>
      <a href="https://littlehuihuihui.github.io/data-analyst-gallery/" class="nav-link" target="_blank" rel="noopener">个人展馆</a>
      <a href="https://littlehuihuihui.github.io/financial-data-portfolio/" class="nav-link" target="_blank" rel="noopener">数据平台</a>
    </div>
    <div class="nav-right">
      <div class="nav-search">
        <span class="nav-search-icon">🔍</span>
        <input type="text" placeholder="搜索..." />
      </div>
    </div>
  </nav>

<div class="container">
    <!-- 搜索头部 -->
    <div class="search-header">
      <h1 class="search-title">智能搜索</h1>
      <p class="search-subtitle">基于语义理解的行业知识检索，用自然语言找到你想要的答案</p>
      
      <!-- 模式切换 -->
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="search">🔍 语义搜索</button>
        <button class="mode-tab" data-mode="ask">💡 智能问答</button>
      </div>

      <!-- 搜索框 -->
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="输入你想了解的内容，比如：SaaS的核心指标有哪些？">
        <button class="search-btn" id="searchBtn">🔍</button>
      </div>

      <!-- 搜索建议 -->
      <div class="search-suggestions">
        <span class="suggestion-tag" data-query="SaaS核心指标">SaaS核心指标</span>
        <span class="suggestion-tag" data-query="游戏行业留存率">游戏行业留存率</span>
        <span class="suggestion-tag" data-query="什么是北极星指标">什么是北极星指标</span>
        <span class="suggestion-tag" data-query="RFM模型怎么用">RFM模型怎么用</span>
        <span class="suggestion-tag" data-query="直播电商UV价值">直播电商UV价值</span>
      </div>
    </div>

    <!-- 结果区域 -->
    <div id="resultsArea">
      <!-- 初始状态：统计信息 -->
      <div class="stats-bar" id="statsBar">
        <div class="stat-item">
          <div class="stat-num" id="totalChunks">-</div>
          <div class="stat-label">知识条目</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">12</div>
          <div class="stat-label">行业覆盖</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">140+</div>
          <div class="stat-label">核心指标</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://localhost:5000/api'
      : '';
    let currentMode = 'search';
    let offlineReady = false;
    let useOffline = !!API_BASE;

    loadStats();
    bindEvents();
    warmOfflineIndex().then(function () {
      var params = new URLSearchParams(location.search);
      var q = params.get('q');
      if (q) {
        document.getElementById('searchInput').value = q;
        doSearch();
      }
    });

    function bindEvents() {
      document.getElementById('searchBtn').addEventListener('click', doSearch);
      document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') doSearch();
      });

      document.querySelectorAll('.mode-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('.mode-tab').forEach(function (t) { t.classList.remove('active'); });
          this.classList.add('active');
          currentMode = this.dataset.mode;
          var input = document.getElementById('searchInput');
          input.placeholder = currentMode === 'search'
            ? '输入你想了解的内容，比如：SaaS的核心指标有哪些？'
            : '问一个问题，比如：什么是LTV/CAC？健康值是多少？';
        });
      });

      document.querySelectorAll('.suggestion-tag').forEach(function (tag) {
        tag.addEventListener('click', function () {
          document.getElementById('searchInput').value = this.dataset.query;
          doSearch();
        });
      });
    }

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    function warmOfflineIndex() {
      if (window.KNOWLEDGE_GRAPH_DATA) {
        offlineReady = true;
        return Promise.resolve();
      }
      return loadScript('../knowledge-graph-data.js').then(function () {
        offlineReady = !!window.KNOWLEDGE_GRAPH_DATA;
      }).catch(function () {
        offlineReady = false;
      });
    }

    function nodeUrl(n) {
      var q = encodeURIComponent(n.name || '');
      if (n.type === 'metric') return '../metrics.html?q=' + q + (n.category ? '&industry=' + encodeURIComponent(n.category) : '');
      if (n.type === 'methodology') return '../methodology.html?q=' + q;
      if (n.type === 'business_problem') return '../interview.html?q=' + q + (n.category ? '&industry=' + encodeURIComponent(n.category) : '');
      return '../knowledge-graph.html?q=' + q;
    }

    function typeLabel(t) {
      if (t === 'metric') return '指标字典';
      if (t === 'methodology') return '方法论';
      if (t === 'business_problem') return '业务问题';
      return '知识';
    }

    function offlineSearch(query, limit) {
      limit = limit || 8;
      var DATA = window.KNOWLEDGE_GRAPH_DATA;
      if (!DATA || !DATA.nodes) return [];
      var q = String(query || '').trim().toLowerCase();
      if (!q) return [];
      var tokens = q.split(/\s+/).filter(Boolean);
      var scored = [];
      DATA.nodes.forEach(function (n) {
        if (!n || n.isRoot || n.isCategory) return;
        if (!n.type || ['metric', 'methodology', 'business_problem'].indexOf(n.type) < 0) return;
        var blob = ((n.name || '') + ' ' + (n.description || '') + ' ' + (n.categoryName || '') + ' ' +
          ((n.detail && n.detail.definition) || '') + ' ' + ((n.detail && n.detail.formula) || '')).toLowerCase();
        var score = 0;
        if (blob.indexOf(q) >= 0) score += 50;
        tokens.forEach(function (t) {
          if (blob.indexOf(t) >= 0) score += 12;
          if ((n.name || '').toLowerCase().indexOf(t) >= 0) score += 20;
        });
        if (score <= 0) return;
        var d = n.detail || {};
        scored.push({
          title: n.name,
          category: typeLabel(n.type) + (n.categoryName ? ' · ' + n.categoryName : ''),
          summary: d.definition || n.description || d.formula || '点击查看详情',
          url: nodeUrl(n),
          similarity: Math.min(0.99, score / 100),
          _score: score
        });
      });
      scored.sort(function (a, b) { return b._score - a._score; });
      return scored.slice(0, limit);
    }

    function offlineAsk(question) {
      var hits = offlineSearch(question, 5);
      if (!hits.length) {
        return {
          answer: '本地知识库里没有找到足够匹配的内容。可以换个关键词，或直接打开指标字典 / 方法论 / 业务问题拆解浏览。',
          sources: [],
          note: '当前为 GitHub Pages 本地关键词检索（语义服务未连接）'
        };
      }
      var lines = hits.slice(0, 3).map(function (h, i) {
        return (i + 1) + '. 「' + h.title + '」：' + String(h.summary || '').slice(0, 80);
      });
      return {
        answer: '根据本地知识库，与「' + question + '」较相关的条目：\n\n' + lines.join('\n'),
        sources: hits,
        note: '当前为本地关键词检索。启动 rag/app.py 后可启用语义检索与更完整问答。'
      };
    }

    async function loadStats() {
      var el = document.getElementById('totalChunks');
      try {
        if (useOfflineOnly()) throw new Error('skip');
        var res = await fetch(API_BASE + '/stats', { signal: AbortSignal.timeout ? AbortSignal.timeout(2500) : undefined });
        if (!res.ok) throw new Error('bad status');
        var data = await res.json();
        el.textContent = data.total_chunks || '-';
        useOffline = true;
      } catch (e) {
        useOffline = false;
        await warmOfflineIndex();
        var n = (window.KNOWLEDGE_GRAPH_DATA && window.KNOWLEDGE_GRAPH_DATA.nodes)
          ? window.KNOWLEDGE_GRAPH_DATA.nodes.filter(function (x) {
              return x && !x.isRoot && !x.isCategory && ['metric', 'methodology', 'business_problem'].indexOf(x.type) >= 0;
            }).length
          : '-';
        el.textContent = n;
        showModeHint();
      }
    }

    function useOfflineOnly() {
      return !API_BASE;
    }

    function showModeHint() {
      var sub = document.querySelector('.search-subtitle');
      if (!sub || sub.getAttribute('data-offline') === '1') return;
      sub.setAttribute('data-offline', '1');
      sub.innerHTML = '线上静态站默认使用<strong>本地关键词检索</strong>（可跳转指标/方法/业务问题）。本机启动 <code>rag/app.py</code> 后可切换语义检索。';
    }

    async function doSearch() {
      var query = document.getElementById('searchInput').value.trim();
      if (!query) return;
      var resultsArea = document.getElementById('resultsArea');
      resultsArea.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>正在搜索中...</p></div>';
      try {
        if (currentMode === 'search') await doSemanticSearch(query);
        else await doAsk(query);
      } catch (e) {
        resultsArea.innerHTML =
          '<div class="empty-state"><div class="empty-icon">⚠️</div><p>搜索失败：' + escapeHtml(e.message || String(e)) +
          '</p><p style="font-size:13px;margin-top:8px;">可尝试本地检索，或检查网络后重试</p></div>';
      }
    }

    async function doSemanticSearch(query) {
      var results = [];
      var fromLocal = false;
      if (useOffline && API_BASE) {
        try {
          var res = await fetch(API_BASE + '/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: query, n_results: 5 })
          });
          if (!res.ok) throw new Error('api');
          var data = await res.json();
          results = data.results || [];
        } catch (e) {
          useOffline = false;
        }
      }
      if (!results.length) {
        await warmOfflineIndex();
        results = offlineSearch(query, 8);
        fromLocal = true;
        showModeHint();
      }
      renderSearchResults(results, fromLocal);
    }

    function renderSearchResults(results, fromLocal) {
      var resultsArea = document.getElementById('resultsArea');
      if (!results.length) {
        resultsArea.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>没有找到相关结果</p></div>';
        return;
      }
      var html = '<div class="results-section"><div class="results-header"><div class="results-count">找到 <strong>' +
        results.length + '</strong> 个相关结果' + (fromLocal ? '（本地检索）' : '') + '</div></div>';
      results.forEach(function (result) {
        var similarityPercent = ((result.similarity || 0) * 100).toFixed(1);
        html +=
          '<a class="result-card" href="' + escapeHtml(result.url) + '" style="display:block;text-decoration:none;color:inherit;">' +
          '<div class="result-header"><h3 class="result-title">' + escapeHtml(result.title) + '</h3>' +
          '<span class="result-score">相关度 ' + similarityPercent + '%</span></div>' +
          '<span class="result-category">' + escapeHtml(result.category || '') + '</span>' +
          '<p class="result-summary">' + escapeHtml(result.summary || '') + '</p></a>';
      });
      html += '</div>';
      resultsArea.innerHTML = html;
    }

    async function doAsk(question) {
      var payload = null;
      if (useOffline && API_BASE) {
        try {
          var res = await fetch(API_BASE + '/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: question, n_results: 3 })
          });
          if (!res.ok) throw new Error('api');
          payload = await res.json();
        } catch (e) {
          useOffline = false;
        }
      }
      if (!payload) {
        await warmOfflineIndex();
        payload = offlineAsk(question);
        showModeHint();
      }
      renderAsk(payload);
    }

    function renderAsk(data) {
      var resultsArea = document.getElementById('resultsArea');
      var html =
        '<div class="answer-section"><div class="answer-card">' +
        '<div class="answer-label">💡 回答</div>' +
        '<div class="answer-text">' + escapeHtml(data.answer || '').replace(/\n/g, '<br>') + '</div>' +
        '<div class="answer-sources"><div class="sources-title">📚 参考来源</div>';
      (data.sources || []).forEach(function (source, index) {
        var similarityPercent = ((source.similarity || 0) * 100).toFixed(1);
        html +=
          '<a class="source-item" href="' + escapeHtml(source.url) + '" style="display:flex;text-decoration:none;color:inherit;">' +
          '<span class="source-title">' + (index + 1) + '. ' + escapeHtml(source.title) + '</span>' +
          '<span class="source-score">' + similarityPercent + '%</span></a>';
      });
      html += '</div><p style="font-size:12px;color:var(--text-muted);margin-top:16px;">' +
        escapeHtml(data.note || '') + '</p></div></div>';
      resultsArea.innerHTML = html;
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }
  </script>
  <script src="../common.js?v=11"></script>
</body>
</html>
