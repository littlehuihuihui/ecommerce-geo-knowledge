  <style>
    .page-header {
      padding: 60px 24px 40px;
      text-align: center;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(251, 191, 36, 0.12), transparent);
    }

    .page-title {
      font-size: 36px;
      font-weight: 700;
      margin: 0 0 12px;
      background: linear-gradient(135deg, var(--text), var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-desc {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 32px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--warning), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* 筛选栏 */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      background: var(--glass);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    .filter-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tag {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-muted);
      transition: all 0.2s ease;
      user-select: none;
    }

    .filter-tag:hover {
      background: var(--glass-highlight);
      color: var(--text);
    }

    .filter-tag.active {
      background: var(--warning-soft);
      color: var(--warning);
      border-color: transparent;
    }

    /* 题目卡片 */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-card {
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .question-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .question-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .question-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      line-height: 1.5;
      flex: 1;
    }

    .question-meta {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .question-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--glass-highlight);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .question-tag.difficulty-easy {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
    }

    .question-tag.difficulty-medium {
      background: rgba(251, 191, 36, 0.15);
      color: var(--warning);
    }

    .question-tag.difficulty-hard {
      background: rgba(248, 113, 113, 0.15);
      color: var(--danger);
    }

    .question-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .question-card.expanded .question-answer {
      max-height: 1000px;
    }

    .answer-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .answer-label::before {
      content: '💡';
      font-size: 14px;
    }

    .answer-content {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      padding-left: 20px;
      border-left: 2px solid var(--accent-soft);
    }

    .answer-content ul {
      margin: 8px 0;
      padding-left: 20px;
    }

    .answer-content li {
      margin-bottom: 6px;
    }

    .answer-content strong {
      color: var(--text);
      font-weight: 600;
    }

    .expand-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
      text-align: right;
      opacity: 0.6;
    }

    .question-card.expanded .expand-hint {
      display: none;
    }

    /* 分类标题 */
    .category-title {
      font-size: 18px;
      font-weight: 600;
      margin: 32px 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-title .icon {
      font-size: 22px;
    }

    .category-title .count {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      background: var(--glass-highlight);
      padding: 2px 10px;
      border-radius: 100px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 28px;
      }

      .stats-bar {
        gap: 24px;
      }

      .stat-num {
        font-size: 22px;
      }
    }
  </style>
</head>

  <script>
    // 面试题数据
    const questions = [
      // ===== 通用 =====
      {
        category: "general",
        categoryName: "通用数据分析",
        icon: "📊",
        list: [
          {
            title: "销售额下降了，你怎么分析原因？",
            difficulty: "easy",
            answer: `
              <p>这是数据分析中最经典的问题，考察结构化分析框架能力。</p>
              <ul>
                <li><strong>第一步：确认数据真实性</strong> — 排除数据统计错误、口径变化、系统bug</li>
                <li><strong>第二步：拆解维度定位问题</strong>
                  <ul>
                    <li>按时间：是突然下降还是持续下降？哪天开始的？</li>
                    <li>按区域：哪些地区/门店下降最多？</li>
                    <li>按品类：哪些商品下降最多？是新品还是老品？</li>
                    <li>按用户：新客还是老客下降？高价值还是低价值用户？</li>
                    <li>按渠道：线上还是线下？哪个渠道？</li>
                  </ul>
                </li>
                <li><strong>第三步：公式拆解找根因</strong>
                  <ul>
                    <li>销售额 = 客流量 × 转化率 × 客单价</li>
                    <li>是客流少了？还是转化低了？还是客单价降了？</li>
                  </ul>
                </li>
                <li><strong>第四步：外部因素验证</strong> — 竞品活动？节假日？天气？政策？</li>
                <li><strong>第五步：给出建议</strong> — 针对找到的原因给出可落地的优化方案</li>
              </ul>
              <p><strong>关键：</strong>不要一上来就瞎猜原因，要有结构化的分析框架，先拆解再定位。</p>
            `
          },
          {
            title: "如何评估一个新功能的效果？",
            difficulty: "medium",
            answer: `
              <ul>
                <li><strong>核心方法：A/B 测试</strong>
                  <ul>
                    <li>设置对照组（无新功能）和实验组（有新功能）</li>
                    <li>随机分流，确保两组用户特征一致</li>
                    <li>统计显著性检验（p值 < 0.05）</li>
                  </ul>
                </li>
                <li><strong>评估指标体系</strong>
                  <ul>
                    <li>核心指标：功能使用率、核心行为转化率</li>
                    <li>反向指标：有没有导致其他指标下降？</li>
                    <li>长期指标：留存、LTV影响</li>
                  </ul>
                </li>
                <li><strong>如果不能做A/B测试</strong>
                  <ul>
                    <li>前后对比法（注意排除时间因素）</li>
                    <li>倾向得分匹配（PSM）</li>
                    <li>断点回归（RDD）</li>
                  </ul>
                </li>
              </ul>
            `
          },
          {
            title: "如何做用户分群？有哪些方法？",
            difficulty: "medium",
            answer: `
              <ul>
                <li><strong>规则分群（简单直接）</strong>
                  <ul>
                    <li>RFM 分群：按最近购买、频率、金额分层</li>
                    <li>生命周期分群：新客/成长/成熟/衰退/流失</li>
                    <li>价值分群：高价值/中价值/低价值</li>
                  </ul>
                </li>
                <li><strong>算法分群（更精细）</strong>
                  <ul>
                    <li>K-Means 聚类：最常用，需要先确定K值</li>
                    <li>层次聚类：可以看到分群层级关系</li>
                    <li>DBSCAN：可以发现任意形状的簇，能识别异常点</li>
                  </ul>
                </li>
                <li><strong>分群后要做什么？</strong>
                  <ul>
                    <li>给每个群起名字、画画像</li>
                    <li>制定差异化运营策略</li>
                    <li>追踪分群变化（迁移矩阵）</li>
                  </ul>
                </li>
              </ul>
            `
          },
          {
            title: "数据分析师和数据产品经理有什么区别？",
            difficulty: "easy",
            answer: `
              <ul>
                <li><strong>数据分析师</strong>
                  <ul>
                    <li>核心：发现问题、解释原因、给出建议</li>
                    <li>产出：分析报告、洞察结论、数据看板</li>
                    <li>更偏"分析"，回答"为什么"和"怎么办"</li>
                  </ul>
                </li>
                <li><strong>数据产品经理</strong>
                  <ul>
                    <li>核心：设计数据产品、让数据用起来</li>
                    <li>产出：数据平台、BI系统、指标体系、数据工具</li>
                    <li>更偏"产品"，思考"怎么让数据更好用"</li>
                  </ul>
                </li>
                <li><strong>两者关系</strong>
                  <ul>
                    <li>分析师是数据产品的用户</li>
                    <li>数据产品经理把分析师的需求产品化</li>
                    <li>好的数据产品能让分析师效率提升10倍</li>
                  </ul>
                </li>
              </ul>
            `
          },
          {
            title: "你做过的最有成就感的项目是什么？",
            difficulty: "medium",
            answer: `
              <p>项目经验类问题，用 STAR 法则梳理你的项目经历：</p>
              <ul>
                <li><strong>S - Situation</strong>：背景是什么？遇到了什么问题？</li>
                <li><strong>T - Task</strong>：你的任务是什么？目标是什么？</li>
                <li><strong>A - Action</strong>：你做了什么？<strong>重点讲你自己的贡献，不是团队的</strong></li>
                <li><strong>R - Result</strong>：结果怎么样？有数据量化吗？</li>
              </ul>
              <p><strong>加分点：</strong></p>
              <ul>
                <li>有具体的数字（提升了XX%，节省了XX万）</li>
                <li>体现了你的思考，而不只是执行</li>
                <li>有复盘和反思，从中学到了什么</li>
              </ul>
            `
          }
        ]
      },

      // ===== 零售 =====
      {
        category: "retail",
        categoryName: "零售行业",
        icon: "🏪",
        list: [
          {
            title: "坪效下降了，怎么分析？",
            difficulty: "medium",
            answer: `
              <p>坪效 = 销售额 ÷ 营业面积，是零售最核心的效率指标。</p>
              <ul>
                <li><strong>先拆分子指标</strong>
                  <ul>
                    <li>坪效 = 客流 × 转化率 × 客单价 ÷ 面积</li>
                    <li>看是哪个因子导致的下降</li>
                  </ul>
                </li>
                <li><strong>按门店类型拆解</strong>
                  <ul>
                    <li>是所有门店都降，还是个别门店？</li>
                    <li>新店还是老店？大店还是小店？</li>
                    <li>商圈类型：购物中心/社区/街边？</li>
                  </ul>
                </li>
                <li><strong>常见原因</strong>
                  <ul>
                    <li>客流端：周边竞品开业、商圈衰退、交通变化</li>
                    <li>转化端：商品结构问题、服务质量下降、价格没竞争力</li>
                    <li>客单端：促销减少、高客单商品卖不动、连带率下降</li>
                    <li>供给端：缺货严重、新品不给力</li>
                  </ul>
                </li>
              </ul>
            `
          },
          {
            title: "库存周转天数太高，怎么优化？",
            difficulty: "hard",
            answer: `
              <ul>
                <li><strong>先定位问题</strong>
                  <ul>
                    <li>是所有品类都高，还是个别品类？</li>
                    <li>是新品还是老品？畅销品还是滞销品？</li>
                    <li>是采购多了，还是卖不动？</li>
                  </ul>
                </li>
                <li><strong>优化方向</strong>
                  <ul>
                    <li><strong>需求预测</strong>：提升预测准确率，减少盲目采购
                      <ul>
                        <li>用历史销售数据做预测</li>
                        <li>考虑季节、促销、竞品等因素</li>
                      </ul>
                    </li>
                    <li><strong>ABC分类管理</strong>：
                      <ul>
                        <li>A类（高价值）：严格控制，小批量多频次</li>
                        <li>C类（低价值）：可以多备点，减少管理成本</li>
                      </ul>
                    </li>
                    <li><strong>滞销品处理</strong>：
                      <ul>
                        <li>促销清仓、捆绑销售、调拨到其他门店</li>
                        <li>退货给供应商（如果合同允许）</li>
                      </ul>
                    </li>
                    <li><strong>供应链优化</strong>：
                      <ul>
                        <li>缩短采购周期</li>
                        <li>VMI（供应商管理库存）</li>
                        <li>JIT（准时制）</li>
                      </ul>
                    </li>
                  </ul>
                </li>
              </ul>
            `
          },
          {
            title: "如何设计会员体系？",
            difficulty: "hard",
            answer: `
              <ul>
                <li><strong>第一步：用户分层</strong>
                  <ul>
                    <li>用RFM模型或消费金额分层</li>
                    <li>一般分3-5级，太多太复杂用户记不住</li>
                    <li>每层要有明确的晋升门槛和权益差异</li>
                  </ul>
                </li>
                <li><strong>第二步：权益设计</strong>
                  <ul>

    // 当前筛选

    let currentSearch = '';

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      renderQuestions();
      
      // 搜索
      document.getElementById('searchInput').addEventListener('input', function(e) {
        currentSearch = e.target.value.trim().toLowerCase();
        renderQuestions();
      });
      
      // 筛选标签
      document.querySelectorAll('.filter-tag').forEach(tag => {
        tag.addEventListener('click', function() {
          document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentCategory = this.dataset.category;
          renderQuestions();
        });
      });
    });

    // 渲染题目
    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const emptyState = document.getElementById('emptyState');
      
      // 筛选
      let filteredCategories = questions.filter(cat => {
        const matchCategory = currentCategory === 'all' || cat.category === currentCategory;
        if (!matchCategory) return false;
        
        // 搜索筛选
        if (currentSearch) {
          const hasMatch = cat.list.some(q => 
            q.title.toLowerCase().includes(currentSearch) ||
            q.answer.toLowerCase().includes(currentSearch)
          );
          return hasMatch;
        }
        return true;
      });
      
      // 空状态
      const totalQuestions = filteredCategories.reduce((sum, cat) => sum + cat.list.length, 0);
      if (filteredCategories.length === 0 || totalQuestions === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      
      // 渲染
      let html = '';
      filteredCategories.forEach(cat => {
        let filteredList = cat.list;
        if (currentSearch) {
          filteredList = cat.list.filter(q => 
            q.title.toLowerCase().includes(currentSearch) ||
            q.answer.toLowerCase().includes(currentSearch)
          );
        }
        
        if (filteredList.length === 0) return;
        
        html += `
          <h2 class="category-title">
            <span class="icon">${cat.icon}</span>
            ${cat.categoryName}
            <span class="count">${filteredList.length} 题</span>
          </h2>
          <div class="question-list">
            ${filteredList.map((q, i) => renderQuestionCard(q, cat.category + '_' + i)).join('')}
          </div>
        `;
      });
      
      container.innerHTML = html;
      
      // 绑定展开/收起
      document.querySelectorAll('.question-card').forEach(card => {
        card.addEventListener('click', function() {
          this.classList.toggle('expanded');
        });
      });
    }

    // 渲染单个题目卡片
    function renderQuestionCard(question, id) {
      const difficultyMap = {
        easy: { label: '简单', class: 'difficulty-easy' },
        medium: { label: '中等', class: 'difficulty-medium' },
        hard: { label: '困难', class: 'difficulty-hard' }
      };
      const diff = difficultyMap[question.difficulty];
      
      return `
        <div class="card question-card" id="${id}">
          <div class="question-header">
            <h3 class="question-title">${question.title}</h3>
            <div class="question-meta">
              <span class="question-tag ${diff.class}">${diff.label}</span>
            </div>
          </div>
          <div class="question-answer">
            <div class="answer-label">分析思路</div>
            <div class="answer-content">${question.answer}</div>
          </div>
          <div class="expand-hint">点击展开答案 →</div>
        </div>
      `;
    }
