    .page-header {
      padding: 60px 24px 40px;

        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(251, 191, 36, 0.12), transparent);
    }

    .page-title {
      font-size: 36px;
      font-weight: 700;
      margin: 0 0 12px;
      background: linear-gradient(135deg, var(--text), var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-desc {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 32px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--warning), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* 筛选栏 */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      background: var(--glass);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    .filter-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tag {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-muted);
      transition: all 0.2s ease;
      user-select: none;
    }

    .filter-tag:hover {
      background: var(--glass-highlight);
      color: var(--text);
    }

    .filter-tag.active {
      background: var(--warning-soft);
      color: var(--warning);
      border-color: transparent;
    }

    /* 题目卡片 */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-card {
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .question-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .question-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .question-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      line-height: 1.5;
      flex: 1;
    }

    .question-meta {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .question-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--glass-highlight);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .question-tag.difficulty-easy {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
    }

    .question-tag.difficulty-medium {
      background: rgba(251, 191, 36, 0.15);
      color: var(--warning);
    }

    .question-tag.difficulty-hard {
      background: rgba(248, 113, 113, 0.15);
      color: var(--danger);
    }

    .question-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .question-card.expanded .question-answer {
      max-height: 1000px;
    }

    .answer-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .answer-label::before {
      content: '💡';
      font-size: 14px;
    }

    .answer-content {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      padding-left: 20px;
      border-left: 2px solid var(--accent-soft);
    }

    .answer-content ul {
      margin: 8px 0;
      padding-left: 20px;
    }

    .answer-content li {
      margin-bottom: 6px;
    }

    .answer-content strong {
      color: var(--text);
      font-weight: 600;
    }

    .expand-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
      text-align: right;
      opacity: 0.6;
    }

    .question-card.expanded .expand-hint {
      display: none;
    }

    /* 分类标题 */
    .category-title {
      font-size: 18px;
      font-weight: 600;
      margin: 32px 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-title .icon {
      font-size: 22px;
    }

    .category-title .count {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      background: var(--glass-highlight);
      padding: 2px 10px;
      border-radius: 100px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 28px;
      }

      .stats-bar {
        gap: 24px;
      }

      .stat-num {
        font-size: 22px;
      }
    }
  </style>

  <script>
    // 面试题数据
    const questions = [
      // ===== 通用 =====
      {
        category: "general",
        categoryName: "通用数据分析",
        icon: "📊",
        list: [
          {
            title: "销售额下降了，你怎么分析原因？",
            difficulty: "easy",
            answer: `
              <p>这是数据分析最经典的问题，考察结构化分析框架能力。</p>
              <ul>
                <li><strong>第一步：确认数据真实性</strong> — 排除统计错误、口径变化、系统bug</li>
                <li><strong>第二步：多维度拆解定位</strong>
                  <ul>
                    <li>时间维度：突然下降还是持续下降？哪天开始？</li>
                    <li>区域维度：哪些地区/门店下降最多？</li>
                    <li>品类维度：哪些商品下降最多？新品还是老品？</li>
                    <li>用户维度：新客还是老客？高价值还是低价值？</li>
                    <li>渠道维度：线上还是线下？哪个渠道？</li>
                  </ul>
                </li>
                <li><strong>第三步：公式拆解找根因</strong>
                  <ul>
                    <li>销售额 = 客流量 × 转化率 × 客单价</li>
                    <li>是客流少了？转化低了？还是客单价降了？</li>
                  </ul>
                </li>
                <li><strong>第四步：外部因素验证</strong> — 竞品活动？节假日？天气？政策？</li>
                <li><strong>第五步：给出建议</strong> — 针对原因给出可落地的优化方案</li>
              </ul>
              <p><strong>关键：</strong>不要一上来就瞎猜，要有结构化框架，先拆解再定位。</p>
            `
          },
          {
            title: "如何评估一个新功能的效果？",
            difficulty: "medium",
            answer: `
              <ul>
                <li><strong>核心方法：A/B 测试</strong>
                  <ul>
                    <li>设置对照组（无新功能）和实验组（有新功能）</li>
                    <li>随机分流，确保两组用户特征一致</li>
                    <li>统计显著性检验（p值 < 0.05）</li>
                  </ul>
                </li>
                <li><strong>评估指标体系</strong>
                  <ul>
                    <li>核心指标：功能使用率、留存、收入等</li>
                    <li>辅助指标：使用时长、功能路径、跳出率等</li>
                    <li>护栏指标：不能让其他核心指标下降</li>
                  </ul>
                </li>
                <li><strong>分析维度</strong>
                  <ul>
                    <li>用户分层：不同用户群的效果差异</li>
                    <li>时间维度：短期效果 vs 长期效果</li>
                    <li>归因分析：功能使用与核心指标的因果关系</li>
                  </ul>
                </li>
              </ul>
            `
          },
          {
            title: "数据异常波动，如何快速定位原因？",
            difficulty: "medium",
            answer: `
              <ul>
                <li><strong>1. 确认异常</strong> — 和历史同期比、和上周比、和预测比，确认是真异常</li>
                <li><strong>2. 下钻维度</strong> — 按地区、渠道、用户群、产品等维度拆解，找到异常最集中的维度</li>
                <li><strong>3. 时间点</strong> — 找到异常开始的精确时间点，看当时发生了什么</li>
                <li><strong>4. 排查清单</strong>
                  <ul>
                    <li>数据层：埋点故障、统计错误、口径变更</li>
                    <li>产品层：版本发布、功能改动、策略调整</li>
                    <li>运营层：活动上线、投放变化、客服问题</li>
                    <li>外部层：竞品、政策、节假日、突发事件</li>
                  </ul>
                </li>
                <li><strong>5. 验证假设</strong> — 找到可疑原因后，用数据验证是否匹配</li>
              </ul>
            `
          },
          {
            title: "如何搭建一个业务的指标体系？",
            difficulty: "hard",
            answer: `
              <ul>
                <li><strong>第一步：明确北极星指标</strong> — 业务最核心的一个指标，所有人朝这个方向努力</li>
                <li><strong>第二步：OSM 模型拆解</strong>
                  <ul>
                    <li>Objective：业务目标是什么？</li>
                    <li>Strategy：用什么策略达成目标？</li>
                    <li>Measurement：每个策略用什么指标衡量？</li>
                  </ul>
                </li>
                <li><strong>第三步：指标分级</strong>
                  <ul>
                    <li>一级指标：北极星指标（CEO关注）</li>
                    <li>二级指标：核心驱动因子（部门关注）</li>
                    <li>三级指标：过程指标（执行层关注）</li>
                  </ul>
                </li>
                <li><strong>第四步：维度补充</strong> — 每个指标都要能按用户、渠道、地区、时间等维度下钻</li>
                <li><strong>第五步：质量保障</strong> — 指标定义、口径、数据来源、负责人都要明确</li>
              </ul>
            `
          },
          {
            title: "如何做用户分群？有哪些常用方法？",
            difficulty: "medium",
            answer: `
              <ul>
                <li><strong>1. 规则分群（简单直观）</strong>
                  <ul>
                    <li>RFM 模型：按最近消费、频率、金额分</li>
                    <li>价值分层：按消费金额高低分</li>
                    <li>生命周期：按注册时间/阶段分</li>
                  </ul>
                </li>
                <li><strong>2. 算法分群（数据驱动）</strong>
                  <ul>
                    <li>K-Means 聚类：最常用的无监督分群</li>
                    <li>层次聚类：适合探索性分析</li>
                    <li>DBSCAN：可以发现任意形状的簇</li>
                  </ul>
                </li>
                <li><strong>3. 分群评估</strong>
                  <ul>
                    <li>群内差异小，群间差异大</li>
                    <li>每个群有明确的业务含义</li>
                    <li>分群结果可用于差异化运营</li>
                  </ul>
                </li>
              </ul>
            `
          }

          {
            title: "如何选定业务的北极星指标？",
            difficulty: "medium",
            answer: `
              <ul>
                <li><strong>原则</strong> — 同时体现用户价值与商业结果，可周度追踪，团队能影响</li>
                <li><strong>候选池</strong> — 从活跃、留存、收入、交易频次等中筛选，避免纯虚荣指标</li>
                <li><strong>验证</strong> — 与长期留存/收入相关性强；拆得出输入指标；有护栏指标</li>
                <li><strong>落地</strong> — 统一口径、看板、复盘节奏，并拆到各团队 OKR</li>
              </ul>
            `
          },
          {
            title: "渠道投放效果怎么做归因？",
            difficulty: "hard",
            answer: `
              <ul>
                <li><strong>明确目标事件</strong> — 注册、首单、付费、ROI/ROAS</li>
                <li><strong>选择模型</strong> — 末次/首次/线性/时间衰减/数据驱动，说明适用场景</li>
                <li><strong>注意窗口与去重</strong> — 归因窗口、跨端、自然量挤出、品牌搜索干扰</li>
                <li><strong>实验校准</strong> — 用地理实验/持出实验验证增量，不迷信单一归因报表</li>
                <li><strong>输出</strong> — 预算建议 + 渠道质量分层 + 素材/落地页优化方向</li>
              </ul>
            `
          },
          {
            title: "如何把分析结果讲给业务方听？",
            difficulty: "easy",
            answer: `
              <ul>
                <li><strong>先结论后证据</strong> — 一句话结论 → 关键证据 → 建议动作</li>
                <li><strong>对齐目标</strong> — 用业务语言（GMV、留存、成本），少堆砌术语</li>
                <li><strong>可视化</strong> — 趋势、对比、拆解图，突出变化点</li>
                <li><strong>可执行</strong> — 建议要有负责人、时间、预期影响与验证方式</li>
              </ul>
            `
          },
        ]
      },

      // ===== 电商 =====
      {
        category: "ecommerce",
        categoryName: "电商行业",
        icon: "🛍️",
        list: [
          {
            title: "GMV 下降了，怎么快速定位原因？",
            difficulty: "easy",
            answer: `
              <p>GMV = 访客数 × 转化率 × 客单价，从三大因子拆解：</p>
              <ul>
                <li><strong>流量端</strong>
                  <ul>

    function renderCategoryTabs() {
      const container = document.getElementById('filterTags');
      let html = '<span class="filter-tag active" data-category="all">全部</span>';
      questions.forEach(cat => {
        html += `<span class="filter-tag" data-category="${cat.category}">${cat.categoryName}</span>`;
      });
      container.innerHTML = html;
      
      // 绑定点击事件
      container.querySelectorAll('.filter-tag').forEach(tag => {
        tag.addEventListener('click', function() {
          container.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentCategory = this.dataset.category;
          renderQuestions();
        });
      });
    }

    // 渲染题目
    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const emptyState = document.getElementById('emptyState');
      
      // 筛选
      let filteredCategories = questions.filter(cat => {
        const matchCategory = currentCategory === 'all' || cat.category === currentCategory;
        if (!matchCategory) return false;
        
        // 搜索筛选
        if (currentSearch) {
          const hasMatch = cat.list.some(q => 
            q.title.toLowerCase().includes(currentSearch) ||
            q.answer.toLowerCase().includes(currentSearch)
          );
          return hasMatch;
        }
        return true;
      });
      
      // 空状态
      const totalQuestions = filteredCategories.reduce((sum, cat) => sum + cat.list.length, 0);
      if (filteredCategories.length === 0 || totalQuestions === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      
      // 渲染
      let html = '';
      filteredCategories.forEach(cat => {
        let filteredList = cat.list;
        if (currentSearch) {
          filteredList = cat.list.filter(q => 
            q.title.toLowerCase().includes(currentSearch) ||
            q.answer.toLowerCase().includes(currentSearch)
          );
        }
        
        if (filteredList.length === 0) return;
        
        html += `
          <h2 class="category-title">
            <span class="icon">${cat.icon}</span>
            ${cat.categoryName}
            <span class="count">${filteredList.length} 题</span>
          </h2>
          <div class="question-list">
            ${filteredList.map((q, i) => renderQuestionCard(q, cat.category + '_' + i)).join('')}
          </div>
        `;
      });
      
      container.innerHTML = html;
      
      // 绑定展开/收起
      document.querySelectorAll('.question-card').forEach(card => {
        card.addEventListener('click', function() {
          this.classList.toggle('expanded');
        });
      });
    }

    // 渲染单个题目卡片
    function renderQuestionCard(question, id) {
      const difficultyMap = {
        easy: { label: '简单', class: 'difficulty-easy' },
        medium: { label: '中等', class: 'difficulty-medium' },
        hard: { label: '困难', class: 'difficulty-hard' }
      };
      const diff = difficultyMap[question.difficulty];
      
      return `
        <div class="card question-card" id="${id}">
          <div class="question-header">
            <h3 class="question-title">${question.title}</h3>
            <div class="question-meta">
              <span class="question-tag ${diff.class}">${diff.label}</span>
            </div>
          </div>
          <div class="question-answer">
            <div class="answer-label">分析思路</div>
            <div class="answer-content">${question.answer}</div>
          </div>
          <div class="expand-hint">点击展开答案 →</div>
        </div>
      `;
    }
