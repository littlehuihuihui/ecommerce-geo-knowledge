  <style>
    /* 方法论主题色：科技蓝紫 */
    :root {
      --theme-color: #6366f1;
      --theme-color-rgb: 99, 102, 241;
      --theme-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }

    .page-header {
      padding: 60px 24px 40px;
      text-align: center;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(99, 102, 241, 0.12), transparent);
    }

    .page-title {
      font-size: 36px;
      font-weight: 700;
      margin: 0 0 12px;
      background: linear-gradient(135deg, var(--text), var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-desc {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 32px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 700;
      background: var(--theme-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* 分类标签 */
    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-muted);
      transition: all 0.2s ease;
      user-select: none;
    }

    .tab:hover {
      background: var(--glass-highlight);
      color: var(--text);
    }

    .tab.active {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border-color: transparent;
    }

    /* 搜索框 */
    .search-box {
      max-width: 400px;
      margin: 0 auto 32px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: var(--glass);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--theme-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
    }

    /* 方法卡片网格 */
    .methods-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .method-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .method-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 0;
      background: var(--theme-gradient);
      transition: height 0.3s ease;
      border-radius: 0 2px 2px 0;
    }

    .method-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.1);
    }

    .method-card:hover::before {
      height: 100%;
    }

    .method-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .method-icon {
      font-size: 36px;
      flex-shrink: 0;
    }

    .method-info {
      flex: 1;
    }

    .method-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 4px;
    }

    .method-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    .method-difficulty {
      display: flex;
      gap: 2px;
      margin-top: 8px;
    }

    .star {
      font-size: 12px;
      color: #fbbf24;
    }

    .star.empty {
      color: var(--glass-border);
    }

    .method-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0 0 16px;
    }

    .method-formula {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .formula-label {
      font-size: 11px;
      font-weight: 600;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .formula-text {
      font-size: 13px;
      color: var(--text);
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      line-height: 1.5;
      white-space: pre-line;
    }

    .method-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tag-label {
      font-size: 11px;
      color: var(--text-muted);
      width: 100%;
      margin-bottom: 4px;
    }

    .method-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--glass-highlight);
      color: var(--text-secondary);
      border: 1px solid var(--glass-border);
    }

    .industry-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: var(--glass-highlight);
      color: var(--text-muted);
    }

    .industry-tag.green {
      background: rgba(52, 211, 153, 0.1);
      color: #34d399;
    }

    .industry-tag.blue {
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
    }

    .industry-tag.orange {
      background: rgba(251, 146, 60, 0.1);
      color: #fb923c;
    }

    .industry-tag.yellow {
      background: rgba(251, 191, 36, 0.1);
      color: #fbbf24;
    }

    .industry-tag.red {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    .industry-tag.purple {
      background: rgba(139, 92, 246, 0.1);
      color: #8b5cf6;
    }

    .industry-tag.pink {
      background: rgba(236, 72, 153, 0.1);
      color: #ec4899;
    }

    .industry-tag.cyan {
      background: rgba(6, 182, 212, 0.1);
      color: #06b6d4;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-text {
      font-size: 15px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .page-title { font-size: 28px; }
      .stats-bar { gap: 24px; }
      .stat-num { font-size: 22px; }
      .methods-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    // 初始化分类标签
    function initTabs() {
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', function() {
          tabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentCategory = this.dataset.category;
          renderMethods();
        });
      });
    }

    // 初始化搜索
    function initSearch() {
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', function() {
        searchKeyword = this.value.toLowerCase().trim();
        renderMethods();
      });
    }

    // 渲染方法卡片
    function renderMethods() {
      const grid = document.getElementById('methodsGrid');
      const emptyState = document.getElementById('emptyState');
      
      let filtered = methods.filter(m => {
        // 分类筛选
        if (currentCategory !== 'all' && m.category !== currentCategory) {
          return false;
        }
        // 搜索筛选
        if (searchKeyword) {
          const searchText = (m.name + m.subtitle + m.desc + m.categoryName + m.scenarios.join('')).toLowerCase();
          if (!searchText.includes(searchKeyword)) {
            return false;
          }
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = filtered.map(m => createMethodCard(m)).join('');
    }

    // 创建方法卡片
    function createMethodCard(m) {
      const stars = Array(5).fill(0).map((_, i) => 
        i < m.difficulty ? '<span class="star">★</span>' : '<span class="star empty">★</span>'
      ).join('');

      return `
        <div class="method-card">
          <div class="method-header">
            <div class="method-icon">${m.icon}</div>
            <div class="method-info">
              <h3 class="method-name">${m.name}</h3>
              <p class="method-subtitle">${m.subtitle}</p>
              <div class="method-difficulty">${stars}</div>
            </div>
          </div>
          <p class="method-desc">${m.desc}</p>
          <div class="method-formula">
            <div class="formula-label">核心公式</div>
            <div class="formula-text">${m.formula}</div>
          </div>
          <div class="method-tags">
            <span class="tag-label">适用场景</span>
            ${m.scenarios.map(s => `<span class="method-tag">${s}</span>`).join('')}
          </div>
          <div class="method-tags">
            <span class="tag-label">应用行业</span>
            ${m.industries.map(i => `<span class="industry-tag ${i.color}">${i.name}</span>`).join('')}
          </div>
        </div>
      `;
    }
