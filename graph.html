<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --theme-color: #8b5cf6;
      --theme-color-rgb: 139, 92, 246;
      --theme-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* 页面容器 */
    .graph-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-top: var(--nav-height);
    }

    /* 顶部工具栏 */
    .graph-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .graph-title {
      font-size: 20px;
      font-weight: 600;
      background: var(--theme-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .industry-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .industry-tab {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .industry-tab:hover {
      border-color: var(--theme-color);
      color: var(--text);
    }

    .industry-tab.active {
      background: var(--theme-gradient);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 200px;
      padding: 8px 12px 8px 36px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--bg-dark);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      border-color: var(--theme-color);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }

    .control-btns {
      display: flex;
      gap: 6px;
    }

    .control-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .control-btn:hover {
      border-color: var(--theme-color);
      color: var(--theme-color);
      background: rgba(139, 92, 246, 0.1);
    }

    /* 图谱容器 */
    .graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #graphChart {
      width: 100%;
      height: 100%;
    }

    /* 图例 */
    .graph-legend {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px;
      z-index: 100;
    }

    .legend-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 统计信息 */
    .graph-stats {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px;
      z-index: 100;
      text-align: right;
    }

    .stats-item {
      margin-bottom: 8px;
    }

    .stats-item:last-child {
      margin-bottom: 0;
    }

    .stats-value {
      font-size: 20px;
      font-weight: 700;
      background: var(--theme-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stats-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 详情面板 */
    .detail-panel {
      position: absolute;
      top: 50%;
      right: 24px;
      transform: translateY(-50%) translateX(120%);
      width: 320px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      z-index: 200;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .detail-panel.show {
      transform: translateY(-50%) translateX(0);
    }

    .detail-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--glass-border);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .detail-close:hover {
      background: var(--theme-color);
      color: white;
    }

    .detail-header {
      margin-bottom: 20px;
    }

    .detail-category {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .detail-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .detail-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .detail-section {
      margin-top: 18px;
    }

    .detail-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-formula {
      background: var(--bg-dark);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      color: var(--accent);
      line-height: 1.6;
      border-left: 3px solid var(--theme-color);
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .detail-tag {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      background: var(--glass-border);
      color: var(--text-muted);
    }

    .detail-related {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .related-node {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      background: rgba(139, 92, 246, 0.15);
      color: var(--theme-color);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .related-node:hover {
      background: var(--theme-color);
      color: white;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .graph-toolbar {
        flex-direction: column;
        gap: 12px;
        padding: 12px 16px;
      }
      
      .toolbar-left, .toolbar-right {
        width: 100%;
        justify-content: center;
      }
      
      .industry-tabs {
        justify-content: center;
      }
      
      .detail-panel {
        right: 16px;
        left: 16px;
        width: auto;
      }
      
      .graph-legend, .graph-stats {
        bottom: 16px;
        left: 16px;
        right: 16px;
      }
      
      .graph-stats {
        left: auto;
      }
    }
  </style>
</head>

  <script>
    // 12个行业的知识图谱数据
    const graphData = {
      ecommerce: {
        name: '电商行业',
        centerColor: '#ec4899',
        categories: [
          {
            name: '核心指标',
            color: '#3b82f6',
            nodes: [
              { name: 'GMV', desc: '成交总额，电商行业最核心的规模指标，衡量平台整体交易规模', formula: 'GMV = 访客数 × 转化率 × 客单价', scenarios: ['衡量平台规模', '业绩考核', '增长分析'], related: ['转化率', '客单价', 'UV价值'] },
              { name: '转化率', desc: '访问用户中完成购买的比例，衡量流量变现效率', formula: '转化率 = 成交用户数 ÷ 访客数 × 100%', scenarios: ['流量质量评估', '页面优化', '转化漏斗分析'], related: ['GMV', '客单价', 'UV价值'] },
              { name: '客单价', desc: '平均每个订单的金额，衡量用户消费能力', formula: '客单价 = GMV ÷ 成交订单数', scenarios: ['用户价值分析', '商品策略', '交叉销售'], related: ['GMV', '复购率', '转化率'] },
              { name: '复购率', desc: '一定周期内重复购买的用户比例，衡量用户忠诚度', formula: '复购率 = 复购用户数 ÷ 总购买用户数 × 100%', scenarios: ['用户留存', '会员体系', 'CRM运营'], related: ['用户生命周期', 'LTV', '留存率'] },
              { name: 'UV价值', desc: '每个访客带来的平均收入，衡量流量质量和变现效率', formula: 'UV价值 = GMV ÷ 访客数', scenarios: ['流量投放评估', '渠道ROI', '流量优化'], related: ['GMV', '转化率', 'ROI'] },
              { name: 'ROI', desc: '投资回报率，衡量营销投入的产出效果', formula: 'ROI = 营销产出 ÷ 营销投入 × 100%', scenarios: ['投放效果评估', '预算分配', '渠道优化'], related: ['UV价值', '获客成本', 'LTV'] }
            ]
          },
          {
            name: '分析方法',
            color: '#10b981',
            nodes: [
              { name: '漏斗分析', desc: '将用户转化路径拆解为多个环节，分析各环节流失率', formula: '各环节转化率 = 下一环节用户数 ÷ 上一环节用户数', scenarios: ['转化优化', '用户路径分析', '流失诊断'], related: ['转化率', 'AARRR模型', '用户画像'] },
              { name: 'RFM模型', desc: '基于最近购买、购买频率、购买金额三维度的用户价值分层', formula: 'R值+F值+M值 → 组合打分 → 8类用户分层', scenarios: ['用户分层', '精准营销', '会员体系'], related: ['用户画像', '复购率', 'LTV'] },
              { name: '同期群分析', desc: '按用户首次行为时间分组，追踪不同群组的留存变化', formula: '第N日留存率 = 第N日活跃同期群用户数 ÷ 同期群总用户数', scenarios: ['留存分析', '产品迭代效果', '渠道质量评估'], related: ['留存率', 'LTV', '用户生命周期'] },
              { name: 'A/B测试', desc: '通过对照实验验证产品或运营策略的效果', formula: '统计显著性检验 + 效果量评估', scenarios: ['产品优化', '运营策略验证', 'UI/UX测试'], related: ['转化率', '漏斗分析', '假设检验'] },
              { name: '归因分析', desc: '分析各渠道对转化的贡献度，优化营销预算分配', formula: '末次归因/首次归因/线性归因/时间衰减归因', scenarios: ['渠道效果评估', '预算分配', '营销优化'], related: ['ROI', '获客成本', '渠道分析'] },

    // 初始化行业标签
    function initIndustryTabs() {
      const container = document.getElementById('industryTabs');
      container.innerHTML = industries.map(ind => 
        `<div class="industry-tab ${ind.key === currentIndustry ? 'active' : ''}" data-industry="${ind.key}">${ind.name}</div>`
      ).join('');

      container.querySelectorAll('.industry-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          container.querySelectorAll('.industry-tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentIndustry = this.dataset.industry;
          renderGraph(currentIndustry);
          hideDetailPanel();
        });
      });
    }

    // 渲染图谱
    function renderGraph(industryKey) {
      const data = graphData[industryKey];
      if (!data) return;

      // 每次重新初始化，避免状态残留
      chart.dispose();
      chart = echarts.init(document.getElementById('graphChart'));

      const nodes = [];
      const links = [];

      // 中心节点
      nodes.push({
        name: data.name,
        symbolSize: 70,
        itemStyle: {
          color: {
            type: 'radial',
            x: 0.5,
            y: 0.5,
            r: 0.5,
            colorStops: [
              { offset: 0, color: data.centerColor },
              { offset: 1, color: data.centerColor + '88' }
            ]
          },
          borderColor: data.centerColor,
          borderWidth: 3,
          shadowBlur: 20,
          shadowColor: data.centerColor
        },
        label: {
          show: true,
          fontSize: 13,
          fontWeight: 'bold',
          color: '#fff'

      });

      // 分类节点和子节点
      data.categories.forEach((cat, catIndex) => {
        // 分类节点
        nodes.push({
          name: cat.name,
          symbolSize: 52,
          category: catIndex,
          itemStyle: {
            color: cat.color,
            borderColor: cat.color,
            borderWidth: 2,
            shadowBlur: 15,
            shadowColor: cat.color + '80'
          },
          label: {
            show: true,
            fontSize: 11,
            fontWeight: '600',
            color: '#fff'
          }
        });

        // 中心到分类的连线
        links.push({
          source: data.name,
          target: cat.name,
          lineStyle: {
            color: cat.color,
            width: 2,
            opacity: 0.6
          }
        });

        // 子节点
        cat.nodes.forEach(node => {
          nodes.push({
            name: node.name,
            symbolSize: 34,
            category: catIndex,
            itemStyle: {
              color: cat.color + 'cc',
              borderColor: cat.color,
              borderWidth: 1.5,
              shadowBlur: 10,
              shadowColor: cat.color + '60'
            },
            label: {
              show: true,
              fontSize: 10,
              color: '#e2e8f0'
            },
            nodeData: node,
            categoryName: cat.name,
            categoryColor: cat.color
          });

          // 分类到子节点的连线
          links.push({
            source: cat.name,
            target: node.name,
            lineStyle: {
              color: cat.color,
              width: 1,
              opacity: 0.4
            }
          });
        });
      });

      // 更新统计
      document.getElementById('nodeCount').textContent = nodes.length;
      document.getElementById('linkCount').textContent = links.length;

      // ECharts配置
      const option = {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'item',
          backgroundColor: 'rgba(15, 23, 42, 0.95)',
          borderColor: 'rgba(139, 92, 246, 0.3)',
          borderWidth: 1,
          textStyle: {
            color: '#e2e8f0',
            fontSize: 12
          },
          formatter: function(params) {
            if (params.dataType === 'node' && params.data.nodeData) {
              return `<div style="font-weight:600;margin-bottom:4px;color:${params.data.categoryColor}">${params.data.name}</div>
                      <div style="font-size:11px;color:#94a3b8;line-height:1.5">${params.data.nodeData.desc}</div>`;
            }
            return params.name;
          }
        },
        series: [{
          type: 'graph',
          layout: 'force',
          data: nodes,
          links: links,
          categories: data.categories.map(cat => ({ name: cat.name })),
          roam: true,
          draggable: true,
          force: {
            repulsion: 400,
            gravity: 0.1,
            edgeLength: [80, 150],
            layoutAnimation: true
          },
          emphasis: {
            focus: 'adjacency',
            lineStyle: {
              width: 3
            },
            itemStyle: {
              shadowBlur: 30
            }
          },
          animationDuration: 1500,
          animationEasingUpdate: 'quinticInOut'
        }]
      };

      chart.setOption(option, true);

      // 节点点击事件
      chart.off('click');
      chart.on('click', function(params) {
        if (params.dataType === 'node' && params.data.nodeData) {
          showDetailPanel(params.data);
        }
      });
    }

    // 显示详情面板
    function showDetailPanel(nodeData) {
      currentNodeData = nodeData;
      const panel = document.getElementById('detailPanel');
      const data = nodeData.nodeData;

      document.getElementById('detailCategory').textContent = nodeData.categoryName;
      document.getElementById('detailCategory').style.background = nodeData.categoryColor + '30';
      document.getElementById('detailCategory').style.color = nodeData.categoryColor;
      document.getElementById('detailName').textContent = nodeData.name;
      document.getElementById('detailDesc').textContent = data.desc;

      // 公式
      const formulaSection = document.getElementById('formulaSection');
      if (data.formula) {
        formulaSection.style.display = 'block';
        document.getElementById('detailFormula').textContent = data.formula;
      } else {
        formulaSection.style.display = 'none';
      }

      // 应用场景
      const scenariosContainer = document.getElementById('detailScenarios');
      scenariosContainer.innerHTML = data.scenarios.map(s => 
        `<span class="detail-tag">${s}</span>`
      ).join('');

      // 相关节点
      const relatedContainer = document.getElementById('detailRelated');
      relatedContainer.innerHTML = data.related.map(r => 
        `<span class="related-node" data-name="${r}">${r}</span>`
      ).join('');

      // 相关节点点击
      relatedContainer.querySelectorAll('.related-node').forEach(node => {
        node.addEventListener('click', function() {
          const targetName = this.dataset.name;
          // 高亮目标节点
          highlightNode(targetName);
        });
      });

      panel.classList.add('show');
    }

    // 隐藏详情面板
    function hideDetailPanel() {
      document.getElementById('detailPanel').classList.remove('show');
      currentNodeData = null;
    }

    // 高亮节点
    function highlightNode(nodeName) {
      // 这里可以实现节点定位和高亮
      // ECharts的dispatchAction
      chart.dispatchAction({
        type: 'highlight',
        name: nodeName
      });

      // 2秒后取消高亮
      setTimeout(() => {
        chart.dispatchAction({
          type: 'downplay',
          name: nodeName
        });
      }, 2000);
    }

    // 搜索功能
    function initSearch() {
      const searchInput = document.getElementById('searchInput');
      let searchTimeout = null;

      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        const keyword = this.value.trim().toLowerCase();
        
        searchTimeout = setTimeout(() => {
          if (!keyword) {
            // 清空搜索，恢复正常
            chart.dispatchAction({ type: 'downplay' });
            return;
          }

          // 搜索匹配的节点
          const data = graphData[currentIndustry];
          let matchedNodes = [];
          
          data.categories.forEach(cat => {
            cat.nodes.forEach(node => {
              if (node.name.toLowerCase().includes(keyword) || 
                  node.desc.toLowerCase().includes(keyword)) {
                matchedNodes.push(node.name);
              }
            });
          });

          // 高亮匹配的节点
          if (matchedNodes.length > 0) {
            chart.dispatchAction({ type: 'downplay' });
            matchedNodes.forEach(name => {
              chart.dispatchAction({
                type: 'highlight',
                name: name
              });
            });
          }
        }, 300);
      });
    }

    // 控制按钮
    function initControls() {
      // 放大
      document.getElementById('zoomIn').addEventListener('click', function() {
        chart.dispatchAction({
          type: 'zoom',
          zoomScale: 1.2
        });
      });

      // 缩小
      document.getElementById('zoomOut').addEventListener('click', function() {
        chart.dispatchAction({
          type: 'zoom',
          zoomScale: 0.8
        });
      });

      // 重置视图
      document.getElementById('resetView').addEventListener('click', function() {
        renderGraph(currentIndustry);
      });

      // 全屏
      document.getElementById('fullscreen').addEventListener('click', function() {
        const container = document.querySelector('.graph-page');
        if (!document.fullscreenElement) {
          container.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });

      // 关闭详情
      document.getElementById('detailClose').addEventListener('click', hideDetailPanel);
    }

    // 初始化（script在页面底部，DOM已加载，直接执行）
    chart = echarts.init(document.getElementById('graphChart'));
    initIndustryTabs();
    renderGraph(currentIndustry);
    initSearch();
    initControls();

    // 窗口大小变化
    window.addEventListener('resize', function() {
      chart.resize();
    });
  </script>
  <script src="common.js?v=10"></script>
</body>
</html>
