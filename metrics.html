<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>指标字典 · 多行业数据百科</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="common.css" />
  <style>
    :root {
      --theme-color: #38bdf8;
      --theme-color-rgb: 56, 189, 248;
      --theme-gradient: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
    }
.container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* 筛选栏 */
    .filter-bar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      margin-bottom: 32px;
    }
    .filter-bar-top {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .browse-mode {
      display: inline-flex;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      gap: 2px;
    }
    .browse-mode-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .browse-mode-btn:hover { color: var(--text); }
    .browse-mode-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .search-box {
      flex: 1;
      min-width: 0;
      width: 100%;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      background: var(--glass);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    .filter-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tag {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-muted);
      transition: all 0.2s ease;
      user-select: none;
    }

    .filter-tag:hover {
      background: var(--glass-highlight);
      color: var(--text);
    }

    .filter-tag.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: transparent;
    }

    /* 指标卡片网格 */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .metric-flip {
      perspective: 1200px;
      min-height: 280px;
    }
    .metric-flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 280px;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .metric-flip.is-flipped .metric-flip-inner {
      transform: rotateY(180deg);
    }
    .metric-face {
      position: absolute;
      inset: 0;
      padding: 20px 20px 48px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: inherit;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: auto;
    }
    .metric-face-front {
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .metric-face-front.card:hover {
      transform: none;
      border-color: rgba(var(--theme-color-rgb), 0.55);
      box-shadow: 0 8px 24px rgba(var(--theme-color-rgb), 0.12);
    }
    .metric-face-back {
      transform: rotateY(180deg);
      background: linear-gradient(160deg, rgba(56, 189, 248, 0.08), rgba(15, 23, 42, 0.55));
    }
    .metric-face-back.card:hover {
      transform: rotateY(180deg);
    }
    .metric-card-hint {
      margin-top: auto;
      padding-top: 10px;
      font-size: 11px;
      color: var(--accent);
      opacity: 0.85;
    }
    .metric-flip-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(var(--theme-color-rgb), 0.45);
      background: rgba(15, 23, 42, 0.85);
      color: #7dd3fc;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .metric-flip-btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      transform: rotate(-20deg);
    }
    .metric-back-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .metric-back-sub {
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .metric-back-sec {
      margin-bottom: 12px;
    }
    .metric-back-sec h4 {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: #7dd3fc;
      letter-spacing: 0.04em;
    }
    .metric-back-sec ul {
      margin: 0;
      padding-left: 18px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .metric-back-sec li { margin: 3px 0; }
    .metric-back-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .metric-back-chips span {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.55);
    }
    .metric-back-actions {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding-right: 42px;
    }
    .metric-back-kg {
      appearance: none;
      border: none;
      background: transparent;
      color: #38bdf8;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* 跳转确认弹层 */
    .kg-ask-mask {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(2, 6, 23, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .kg-ask-mask[hidden] { display: none !important; }
    .kg-ask-dialog {
      width: min(420px, 100%);
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      padding: 22px 22px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .kg-ask-dialog h3 {
      margin: 0 0 8px;
      font-size: 17px;
      color: #f8fafc;
    }
    .kg-ask-dialog p {
      margin: 0 0 18px;
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
    }
    .kg-ask-dialog strong { color: #38bdf8; }
    .kg-ask-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .kg-ask-actions button {
      appearance: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: transparent;
      color: #cbd5e1;
    }
    .kg-ask-actions .kg-ask-go {
      border-color: transparent;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #0f172a;
      font-weight: 600;
    }

    .metric-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .metric-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .metric-category {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--glass-highlight);
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .metric-category .cat-label {
      opacity: 0.7;
      margin-right: 2px;
    }
    .metric-logic-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .metric-logic {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(251, 146, 60, 0.12);
      color: #fdba74;
      border: 1px solid rgba(251, 146, 60, 0.28);
    }
    .metric-logic.is-cost { background: rgba(248, 113, 113, 0.12); color: #fca5a5; border-color: rgba(248, 113, 113, 0.3); }
    .metric-logic.is-growth { background: rgba(52, 211, 153, 0.12); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.3); }
    .metric-logic.is-revenue { background: rgba(250, 204, 21, 0.12); color: #fde047; border-color: rgba(250, 204, 21, 0.3); }
    .metric-role-chip {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.1);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .metric-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 14px;
    }

    .metric-formula {
      font-size: 12px;
      padding: 8px 12px;
      background: var(--bg-elevated);
      border-radius: 6px;
      color: var(--accent);
      font-family: "JetBrains Mono", monospace;
      margin-bottom: 12px;
      border: 1px solid var(--glass-border);
    }

    .metric-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .metric-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .metric-tag.purple {
      background: var(--accent-2-soft);
      color: var(--accent-2);
    }

    .metric-tag.green {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
    }

    .metric-tag.yellow {
      background: rgba(251, 191, 36, 0.15);
      color: var(--warning);
    }

    /* 业务场景标签（可点击速查） */
    .metric-tag.metric-scene {
      background: rgba(56, 189, 248, 0.13);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.28);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .metric-tag.metric-scene::before {
      content: "#";
      opacity: 0.65;
    }

    .metric-tag.metric-scene:hover {
      background: rgba(56, 189, 248, 0.28);
      transform: translateY(-1px);
    }

    .metric-scene-note {
      margin: -12px 0 20px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* 分类区块 */
    .category-section {
      margin-bottom: 48px;
    }

    .category-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .category-title .icon {
      font-size: 24px;
    }

    .category-title .count {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      background: var(--glass-highlight);
      padding: 2px 10px;
      border-radius: 100px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 15px;
    }

    /* 高亮搜索词 */
    .highlight {
      background: rgba(56, 189, 248, 0.3);
      color: var(--accent);
      padding: 0 2px;
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      .metrics-grid {
        grid-template-columns: 1fr;
      }
      .filter-bar-top {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box input {
        font-size: 16px;
      }
    }
  </style>

  <script>
    // 指标数据
    const metrics = [
      // ===== 零售行业 =====
      { name: "销售额", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "一定周期内门店/企业实现的销售总收入，是最核心的经营指标。", formula: "销售额 = 客单价 × 交易笔数 = 客流量 × 转化率 × 客单价", tags: ["核心指标", "销售"] },
      { name: "坪效", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "每平方米营业面积产生的销售额，衡量门店空间利用效率。", formula: "坪效 = 销售额 ÷ 营业面积", tags: ["效率指标"] },
      { name: "人效", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "人均销售额，衡量人力资源利用效率。", formula: "人效 = 销售额 ÷ 员工人数", tags: ["效率指标"] },
      { name: "客流量", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "一定周期内进入门店的顾客数量，是销售的基础。", formula: "客流量 = 进店人数（可通过客流统计设备获取）", tags: ["流量指标"] },
      { name: "客单价", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "平均每笔交易的金额，反映顾客消费能力。", formula: "客单价 = 销售额 ÷ 交易笔数", tags: ["核心指标"] },
      { name: "连带率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "平均每笔交易购买的商品件数，反映交叉销售能力。", formula: "连带率 = 销售总件数 ÷ 交易笔数", tags: ["销售指标"] },
      { name: "SSSG（同店销售增长）", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "Same Store Sales Growth，可比门店销售额同比增长率，剔除新店影响。", formula: "SSSG = (本期同店销售额 - 去年同期同店销售额) ÷ 去年同期同店销售额", tags: ["增长指标"] },
      { name: "动销率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "有销售记录的SKU占总SKU的比例，反映商品结构健康度。", formula: "动销率 = 有销售的SKU数 ÷ 总SKU数 × 100%", tags: ["商品指标"] },
      { name: "售罄率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "一定周期内销售数量占进货数量的比例，衡量商品销售速度。", formula: "售罄率 = 累计销售数量 ÷ 总进货数量 × 100%", tags: ["商品指标"] },
      { name: "库存周转天数", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "库存从入库到销售出去平均需要的天数，越短越好。", formula: "库存周转天数 = 平均库存 ÷ 日均销售成本", tags: ["库存指标", "通用"] },
      { name: "缺货率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "顾客需求的商品缺货的比例，直接影响销售损失。", formula: "缺货率 = 缺货次数 ÷ 总需求次数 × 100%", tags: ["库存指标"] },
      { name: "呆滞库存占比", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "长期未销售的库存占总库存的比例，反映库存健康度。", formula: "呆滞库存占比 = 呆滞库存金额 ÷ 总库存金额 × 100%", tags: ["库存指标", "通用"] },
      { name: "复购率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "一定周期内重复购买的会员占比，反映用户忠诚度。", formula: "复购率 = 复购会员数 ÷ 总购买会员数 × 100%", tags: ["会员指标", "通用"] },
      { name: "RFM 分层", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "基于最近一次购买时间(Recency)、购买频率(Frequency)、购买金额(Monetary)对用户进行价值分层。", formula: "R值 + F值 + M值 → 用户分层（重要价值/重要发展/重要保持/重要挽留等）", tags: ["会员指标", "分析模型", "通用"] },
      { name: "促销 ROI", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "促销活动的投入产出比，衡量营销效率。", formula: "促销ROI = (促销带来的增量销售额 - 促销成本) ÷ 促销成本", tags: ["营销指标"] },
      { name: "CAC（获客成本）", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "Customer Acquisition Cost，获取一个新客户的平均成本。", formula: "CAC = 营销总费用 ÷ 新增客户数", tags: ["营销指标", "通用"] },

      // ===== 物流行业 =====
      { name: "库存周转天数", category: "logistics", categoryName: "物流", icon: "🚚", desc: "库存从入库到出库平均需要的天数，衡量仓储运营效率。", formula: "库存周转天数 = 平均库存金额 ÷ 日均销售成本", tags: ["仓储指标", "通用"] },
      { name: "库容利用率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "仓库实际使用容量占总容量的比例，衡量空间利用效率。", formula: "库容利用率 = 已使用库容 ÷ 总库容 × 100%", tags: ["仓储指标"] },
      { name: "库存准确率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "系统库存与实际库存的一致程度，账实相符率。", formula: "库存准确率 = 账实相符的SKU数 ÷ 盘点总SKU数 × 100%", tags: ["仓储指标"] },
      { name: "订单准时发货率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "在承诺时间内完成发货的订单占比。", formula: "准时发货率 = 准时发货订单数 ÷ 总发货订单数 × 100%", tags: ["仓储指标", "服务指标"] },
      { name: "拣货准确率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "拣货作业中准确无误的比例。", formula: "拣货准确率 = (总拣货行数 - 错误行数) ÷ 总拣货行数 × 100%", tags: ["仓储指标"] },
      { name: "准时送达率 (OTD)", category: "logistics", categoryName: "物流", icon: "🚚", desc: "On Time Delivery，按约定时间准时送达的订单比例。", formula: "OTD = 准时送达订单数 ÷ 总送达订单数 × 100%", tags: ["运输指标", "核心指标"] },
      { name: "车辆装载率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "车辆实际装载量占额定载重的比例，衡量运输资源利用率。", formula: "装载率 = 实际装载重量(体积) ÷ 额定载重(容积) × 100%", tags: ["运输指标", "效率指标"] },
      { name: "吨公里成本", category: "logistics", categoryName: "物流", icon: "🚚", desc: "每吨货物运输一公里的成本，衡量运输效率的核心指标。", formula: "吨公里成本 = 运输总成本 ÷ (运输重量 × 运输距离)", tags: ["运输指标", "成本指标"] },
      { name: "配送破损率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "运输过程中发生破损的货物比例。", formula: "破损率 = 破损件数 ÷ 总运输件数 × 100%", tags: ["运输指标", "质量指标"] },
      { name: "平均配送时效", category: "logistics", categoryName: "物流", icon: "🚚", desc: "从发货到签收的平均时间，衡量配送速度。", formula: "平均配送时效 = 总配送时长 ÷ 总订单数", tags: ["运输指标"] },
      { name: "返程空驶率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "车辆返程时空载行驶的比例，越低越好。", formula: "空驶率 = 空驶里程 ÷ 总行驶里程 × 100%", tags: ["运输指标", "效率指标"] },
      { name: "完美订单率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "同时满足准时、准确、完好、单证齐全的订单比例，供应链综合服务水平。", formula: "完美订单率 = 准时率 × 准确率 × 完好率 × 单证准确率", tags: ["供应链指标", "核心指标"] },
      { name: "需求预测准确率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "需求预测与实际需求的吻合程度，影响库存和补货。", formula: "预测准确率 = 1 - |实际值 - 预测值| ÷ 实际值", tags: ["供应链指标"] },
      { name: "订单履约周期", category: "logistics", categoryName: "物流", icon: "🚚", desc: "从下单到收货的完整周期，衡量供应链响应速度。", formula: "履约周期 = 下单时间 → 收货时间的总时长", tags: ["供应链指标"] },
      { name: "物流费用率", category: "logistics", categoryName: "物流", icon: "🚚", desc: "物流费用占销售额的比例，衡量物流成本控制水平。", formula: "物流费用率 = 物流总费用 ÷ 销售额 × 100%", tags: ["成本指标", "核心指标"] },
      { name: "单件物流成本", category: "logistics", categoryName: "物流", icon: "🚚", desc: "平均每件包裹的物流成本。", formula: "单件物流成本 = 物流总费用 ÷ 总订单数", tags: ["成本指标"] },

      // ===== 文旅行业 =====
      { name: "入园人次", category: "general", categoryName: "通用", icon: "📊", desc: "一定周期内进入景区/乐园的总人数，最核心的客流指标。", formula: "入园人次 = 实际入园游客数量（含年卡/免票）", tags: ["核心指标", "客流"] },
      { name: "平均票价 (ASP)", category: "general", categoryName: "通用", icon: "📊", desc: "Average Selling Price，平均每张票的实际售价。", formula: "ASP = 门票总收入 ÷ 售票张数", tags: ["收入指标"] },
      { name: "票券核销率", category: "general", categoryName: "通用", icon: "📊", desc: "已售出票券中实际被使用的比例，反映预售转化效果。", formula: "核销率 = 已核销票数 ÷ 已售票数 × 100%", tags: ["运营指标"] },
      { name: "提前购票占比", category: "general", categoryName: "通用", icon: "📊", desc: "提前（非当日）购票的游客比例，用于客流预测。", formula: "提前购票占比 = 提前购票人数 ÷ 总购票人数 × 100%", tags: ["运营指标"] },
      { name: "RevPAR", category: "general", categoryName: "通用", icon: "📊", desc: "Revenue Per Available Room，每间可售房收入，酒店业核心指标。", formula: "RevPAR = 客房总收入 ÷ 可售房总数 = 平均房价 × 入住率", tags: ["酒店指标", "核心指标"] },
      { name: "入住率 (OCC)", category: "general", categoryName: "通用", icon: "📊", desc: "Occupancy Rate，实际售出房间占可售房间的比例。", formula: "OCC = 实际售出房晚数 ÷ 可售房晚数 × 100%", tags: ["酒店指标"] },
      { name: "平均房价 (ADR)", category: "general", categoryName: "通用", icon: "📊", desc: "Average Daily Rate，平均每间售出客房的房价。", formula: "ADR = 客房总收入 ÷ 售出房晚数", tags: ["酒店指标"] },
      { name: "收益捕获率 (Yield)", category: "general", categoryName: "通用", icon: "📊", desc: "实际收益与理论最大收益的比值，衡量收益管理效果。", formula: "Yield = 实际客房收入 ÷ (客房总数 × 最高房价) × 100%", tags: ["酒店指标", "收益管理"] },
      { name: "渠道销售占比", category: "general", categoryName: "通用", icon: "📊", desc: "各销售渠道（OTA/直销/旅行社等）的销售额占比。", formula: "渠道占比 = 该渠道销售额 ÷ 总销售额 × 100%", tags: ["渠道指标", "通用"] },
      { name: "直订占比", category: "general", categoryName: "通用", icon: "📊", desc: "通过自有渠道（官网/小程序/电话）直接预订的比例，越高佣金成本越低。", formula: "直订占比 = 直订订单数 ÷ 总订单数 × 100%", tags: ["渠道指标"] },
      { name: "复购率", category: "general", categoryName: "通用", icon: "📊", desc: "一定周期内重复消费的用户比例，反映用户忠诚度。", formula: "复购率 = 复购用户数 ÷ 总消费用户数 × 100%", tags: ["用户指标", "通用"] },
      { name: "NPS / 满意度", category: "general", categoryName: "通用", icon: "📊", desc: "Net Promoter Score，净推荐值，衡量用户口碑与推荐意愿。", formula: "NPS = 推荐者占比(9-10分) - 贬损者占比(0-6分)", tags: ["用户指标", "体验指标", "通用"] },

      // ===== 电商行业 =====
      { name: "GMV", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "Gross Merchandise Volume，成交总额，包含付款和未付款的订单金额。", formula: "GMV = 访客数 × 转化率 × 客单价", tags: ["核心指标", "通用"] },
      { name: "转化率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "访问用户中完成购买的比例，电商最核心的转化指标。", formula: "转化率 = 下单用户数 ÷ 访客数 × 100%", tags: ["核心指标", "转化", "通用"] },
      { name: "支付成功率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "下单后成功完成支付的比例，受支付渠道、网络等影响。", formula: "支付成功率 = 成功支付订单数 ÷ 下单订单数 × 100%", tags: ["转化指标"] },
      { name: "取消率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "下单后被取消的订单比例，反映订单质量。", formula: "取消率 = 取消订单数 ÷ 总下单数 × 100%", tags: ["运营指标"] },
      { name: "拒收率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "COD（货到付款）订单中被拒收的比例，跨境电商尤其关注。", formula: "拒收率 = 拒收订单数 ÷ 发货订单数 × 100%", tags: ["运营指标"] },
      { name: "履约时效", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "从下单到签收的平均时长，衡量物流履约速度。", formula: "履约时效 = 总履约时长 ÷ 总订单数", tags: ["物流指标", "通用"] },
      { name: "SLA 达成率", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "Service Level Agreement，承诺服务水平的达成比例。", formula: "SLA达成率 = 达成SLA的订单数 ÷ 总订单数 × 100%", tags: ["服务指标", "通用"] },
      { name: "AI 可见性与引用份额", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "GEO核心指标，品牌/产品在AI搜索结果中被提及和引用的比例。", formula: "AI引用份额 = 品牌被AI引用次数 ÷ 行业总引用次数 × 100%", tags: ["GEO指标", "AI时代"] },
      { name: "结构化事实覆盖度", category: "ecommerce", categoryName: "电商", icon: "🛒", desc: "GEO指标，品牌/产品的结构化信息（参数、价格、评价等）被AI掌握的程度。", formula: "结构化事实覆盖度 = 已覆盖事实点 ÷ 总事实点 × 100%", tags: ["GEO指标", "AI时代"] },

      // ===== 新能源汽车 =====
      { name: "销量 / 市占率", category: "newenergy", categoryName: "新能源", icon: "⚡", desc: "一定周期内的汽车销售量及在整体市场中的占有率。", formula: "市占率 = 品牌销量 ÷ 市场总销量 × 100%", tags: ["核心指标"] },
      { name: "产能利用率", category: "newenergy", categoryName: "新能源", icon: "⚡", desc: "实际产量占设计产能的比例，衡量生产效率。", formula: "产能利用率 = 实际产量 ÷ 设计产能 × 100%", tags: ["生产指标", "通用"] },
      { name: "电池能量密度", category: "newenergy", categoryName: "新能源", icon: "⚡", desc: "单位重量/体积电池储存的电量，核心技术指标。", formula: "能量密度 = 电池容量 ÷ 电池重量(Wh/kg) 或 ÷ 体积(Wh/L)", tags: ["技术指标"] },
      { name: "充电基础设施覆盖率", category: "newenergy", categoryName: "新能源", icon: "⚡", desc: "充电桩/站在区域内的覆盖程度，影响用户体验。", formula: "覆盖率 = 已建充电桩数 ÷ 规划需求数 × 100%", tags: ["基建指标"] },

      // ===== 制造业 =====
      { name: "OEE（设备综合效率）", category: "manufacturing", categoryName: "制造", icon: "🏭", desc: "Overall Equipment Effectiveness，设备综合效率，衡量设备利用效率。", formula: "OEE = 时间稼动率 × 性能稼动率 × 良品率", tags: ["生产指标", "核心指标"] },
      { name: "良率 / 不良品率", category: "manufacturing", categoryName: "制造", icon: "🏭", desc: "合格产品占总产品的比例，衡量生产质量。", formula: "良率 = 合格品数量 ÷ 总生产数量 × 100%", tags: ["质量指标", "通用"] },
      { name: "产值", category: "manufacturing", categoryName: "制造", icon: "🏭", desc: "一定周期内生产的产品总价值。", formula: "产值 = 产量 × 产品单价", tags: ["生产指标"] },
      { name: "毛利率", category: "manufacturing", categoryName: "制造", icon: "🏭", desc: "毛利占销售收入的比例，反映盈利能力。", formula: "毛利率 = (销售收入 - 销售成本) ÷ 销售收入 × 100%", tags: ["财务指标", "通用"] },
      { name: "制造成本", category: "manufacturing", categoryName: "制造", icon: "🏭", desc: "生产过程中发生的各项成本总和，包括直接材料、直接人工、制造费用。", formula: "制造成本 = 直接材料 + 直接人工 + 制造费用", tags: ["成本指标"] },
      { name: "经销商分级", category: "manufacturing", categoryName: "制造", icon: "🏭", desc: "根据销量、回款、配合度等对经销商进行等级划分。", formula: "综合评分 = 销量(40%) + 回款(30%) + 配合度(20%) + 增长(10%)", tags: ["渠道指标"] },

      // ===== SaaS / 企业服务 =====
      { name: "MRR（月度经常性收入）", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "Monthly Recurring Revenue，每月稳定的订阅收入，SaaS最核心指标。", formula: "MRR = 所有活跃订阅用户的月费之和", tags: ["核心指标", "收入"] },
      { name: "ARR（年度经常性收入）", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "Annual Recurring Revenue，年度经常性收入，MRR的年化。", formula: "ARR = MRR × 12", tags: ["收入指标"] },
      { name: "ARPU（每用户平均收入）", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "Average Revenue Per User，平均每个用户贡献的收入。", formula: "ARPU = 总收入 ÷ 付费用户数", tags: ["收入指标", "通用"] },
      { name: "客户流失率（Churn）", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "一定周期内流失的客户占比，SaaS的生命线指标。", formula: "客户流失率 = 流失客户数 ÷ 期初客户数 × 100%", tags: ["核心指标", "留存"] },
      { name: "收入流失率", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "因客户流失导致的收入损失比例，比客户数流失更重要。", formula: "收入流失率 = 流失MRR ÷ 期初MRR × 100%", tags: ["留存指标"] },
      { name: "NDR（净收入留存率）", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "Net Dollar Retention，净收入留存，考虑扩张和流失后的留存。", formula: "NDR = (期初MRR + 扩张MRR - 流失MRR - 收缩MRR) ÷ 期初MRR", tags: ["核心指标", "留存"] },
      { name: "GRR（总收入留存率）", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "Gross Revenue Retention，毛收入留存，只考虑流失不考虑扩张。", formula: "GRR = (期初MRR - 流失MRR - 收缩MRR) ÷ 期初MRR", tags: ["留存指标"] },
      { name: "CAC（客户获取成本）", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "Customer Acquisition Cost，获取一个新客户的平均成本。", formula: "CAC = 销售与营销总费用 ÷ 新增客户数", tags: ["获客指标", "通用"] },
      { name: "LTV（客户终身价值）", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "Life Time Value，客户在整个生命周期贡献的总价值。", formula: "LTV = ARPU × 客户生命周期 = ARPU ÷ 月流失率", tags: ["核心指标", "通用"] },

      { name: "CAC 回收期", category: "saas", categoryName: "SaaS", icon: "☁️", desc: "收回获客成本需要的时间，越短越好。", formula: "CAC回收期 = CAC ÷ 月均ARPU（月）", tags: ["效率指标"] },

      { name: "账户碎片化率", category: "pension", categoryName: "养老金与公共金融", icon: "🧓", desc: "持有 3 个以上 MPF 账户的成员占比，反映账户治理压力。", formula: "碎片化率 = 持有 3 个以上账户成员 ÷ 总成员 × 100%", tags: ["MPF","治理指标"] },
      { name: "供款合规率", category: "pension", categoryName: "养老金与公共金融", icon: "🧓", desc: "按期足额供款的雇主比例，是 MPF 合规稽查的核心指标。", formula: "供款合规率 = 按期足额供款雇主 ÷ 应供款雇主 × 100%", tags: ["MPF","合规指标"] },
      { name: "拖欠供款案件数", category: "pension", categoryName: "养老金与公共金融", icon: "🧓", desc: "期内立案处理的拖欠供款案件数量。", formula: "拖欠供款案件数 = 期内立案案件数（含雇主违规）", tags: ["MPF","合规指标"] },
      { name: "财政储备", category: "pension", categoryName: "养老金与公共金融", icon: "🧓", desc: "期末财政储备余额，常以「相当于多少个月政府开支」衡量。", formula: "财政储备 = 期末储备余额（或 ÷ 月均政府开支）", tags: ["公共财政","核心指标"] },
      { name: "政府支出结构", category: "pension", categoryName: "养老金与公共金融", icon: "🧓", desc: "教育 / 社福 / 医疗 / 基建等支出占比，反映财政优先次序。", formula: "支出结构 = 各类支出 ÷ 政府总支出 × 100%", tags: ["公共财政"] },
      { name: "已赚保费", category: "insurance", categoryName: "保险", icon: "🛡️", desc: "保费收入扣除未到期责任准备金变动后的部分，是赔付率的分母。", formula: "已赚保费 = 保费收入 − 未到期责任准备金变动", tags: ["保险指标","核心指标"] },
      { name: "费用率", category: "insurance", categoryName: "保险", icon: "🛡️", desc: "费用支出占已赚保费的比例，与赔付率共同构成 COR。", formula: "费用率 = 费用支出 ÷ 已赚保费 × 100%", tags: ["保险指标","成本指标"] },
      { name: "案均赔付", category: "insurance", categoryName: "保险", icon: "🛡️", desc: "赔付总金额与赔付件数的比值，用于区分「出险变多」与「单案变贵」。", formula: "案均赔付 = 赔付总金额 ÷ 赔付件数", tags: ["保险指标"] },
      { name: "承保利润", category: "insurance", categoryName: "保险", icon: "🛡️", desc: "承保业务本身的盈亏，不含投资收益。", formula: "承保利润 = 已赚保费 × (1 − COR)", tags: ["保险指标","盈利指标"] },
      { name: "新业务价值率 NBV Margin", category: "insurance", categoryName: "保险", icon: "🛡️", desc: "新业务价值占新单保费的比例，反映产品结构与渠道质量。", formula: "NBV Margin = NBV ÷ 新单保费 × 100%", tags: ["保险指标","价值指标"] },
      { name: "合同服务边际 CSM", category: "insurance", categoryName: "保险", icon: "🛡️", desc: "IFRS 17 下未实现利润的递延余额，按服务提供进度释放为利润。", formula: "CSM = 期内确认 + 利息增值 + 假设变动 − 释放", tags: ["保险指标","IFRS 17"] },
      { name: "交易额 TPV", category: "payment", categoryName: "支付与金融科技", icon: "💳", desc: "期内支付交易总金额，是支付业务的规模基础。", formula: "TPV = 期内成功交易金额合计", tags: ["支付指标","规模指标"] },
      { name: "交易成功率", category: "payment", categoryName: "支付与金融科技", icon: "💳", desc: "成功交易占发起交易的比例，含通道故障等技术性失败。", formula: "交易成功率 = 成功交易 ÷ 发起交易 × 100%", tags: ["支付指标","核心指标"] },

      { name: "储值金额", category: "payment", categoryName: "支付与金融科技", icon: "💳", desc: "SVF 客户账户储值余额合计，与商户交易规模同时观察。", formula: "储值金额 = 客户账户储值余额合计", tags: ["支付指标","SVF"] },
      { name: "FPS 转账成功率", category: "payment", categoryName: "支付与金融科技", icon: "💳", desc: "转数快（FPS）转账成功笔数占发起笔数的比例。", formula: "FPS 成功率 = 成功转账笔数 ÷ 发起转账笔数 × 100%", tags: ["支付指标","香港"] },
      { name: "成本收入比", category: "banking", categoryName: "银行", icon: "🏦", desc: "营业费用与营业收入的比值，衡量银行经营效率。", formula: "成本收入比 = 营业费用 ÷ 营业收入 × 100%", tags: ["银行指标","效率指标"] },
      { name: "活期存款占比", category: "banking", categoryName: "银行", icon: "🏦", desc: "活期存款占总存款的比例，决定资金成本与净息差空间。", formula: "活期占比 = 活期存款 ÷ 总存款 × 100%", tags: ["银行指标","结构指标"] },
      { name: "存款集中度", category: "banking", categoryName: "银行", icon: "🏦", desc: "前十大存款客户占全部存款的比例，反映批发资金依赖度。", formula: "存款集中度 = 前十大存款客户余额 ÷ 总存款 × 100%", tags: ["银行指标","风控指标"] },
      { name: "期限错配缺口", category: "banking", categoryName: "银行", icon: "🏦", desc: "各期限档资产与负债的差额，是流动性风险与利率风险的共同来源。", formula: "期限缺口 = 各期限档资产 − 负债", tags: ["银行指标","风控指标"] },
      { name: "波动率", category: "securities", categoryName: "证券与资管", icon: "📈", desc: "组合收益率的年化标准差，与客户风险偏好匹配程度直接相关。", formula: "波动率 = 收益率标准差 × √年化周期数", tags: ["投资指标","风险指标"] },
      { name: "信息比率", category: "securities", categoryName: "证券与资管", icon: "📈", desc: "超额收益与跟踪误差的比值，衡量主动管理能力。", formula: "信息比率 = 超额收益 ÷ 跟踪误差", tags: ["投资指标","风险调整收益"] },
      { name: "资金集中度", category: "securities", categoryName: "证券与资管", icon: "📈", desc: "前十大客户 AUM 占比，衡量规模稳定性风险。", formula: "资金集中度 = 前十大客户 AUM ÷ 总 AUM × 100%", tags: ["资管指标","风控指标"] },
      { name: "对账差异率", category: "securities", categoryName: "证券与资管", icon: "📈", desc: "对账出现差异的笔数占比，是运营质量的核心指标。", formula: "对账差异率 = 差异笔数 ÷ 总对账笔数 × 100%", tags: ["资管指标","运营指标"] },
      { name: "大额交易报告数", category: "finance", categoryName: "金融通用", icon: "🏛️", desc: "达到申报门槛的大额交易报告数量，是 AML 监测的基础数据。", formula: "大额交易报告数 = 期内达到门槛并申报的交易笔数", tags: ["合规指标","AML"] },
      { name: "客户风险评级覆盖率", category: "finance", categoryName: "金融通用", icon: "🏛️", desc: "已完成风险评级客户占存量客户的比例，决定差异化监控强度。", formula: "覆盖率 = 已完成评级客户 ÷ 存量客户 × 100%", tags: ["合规指标","AML"] },
      { name: "数据质量校验通过率", category: "finance", categoryName: "金融通用", icon: "🏛️", desc: "监管报送前数据校验规则的通过比例，反映数据治理水平。", formula: "校验通过率 = 通过校验项 ÷ 校验项总数 × 100%", tags: ["合规指标","数据治理"] },

      { name: "合规检查通过率", category: "finance", categoryName: "金融通用", icon: "🏛️", desc: "监管检查或内部合规检查中一次通过的检查项比例，反映合规管理水平。", formula: "合规检查通过率 = 一次通过检查项数 ÷ 检查项总数 × 100%", tags: ["合规指标"], scene: ["合规"] },
      { name: "平均持有期", category: "securities", categoryName: "证券与资管", icon: "📈", desc: "客户持有理财产品从买入到赎回的平均天数，反映产品期限匹配度与客户黏性。", formula: "平均持有期 = Σ 单笔持有天数 ÷ 赎回笔数", tags: ["运营指标", "留存指标"], scene: ["财富", "客户"] },
      { name: "户均资产", category: "securities", categoryName: "证券与资管", icon: "📈", desc: "客户平均管理资产规模，衡量客户质量与分层经营成效。", formula: "户均资产 = 期末 AUM ÷ 有效客户数", tags: ["规模指标", "客户指标"], scene: ["财富", "客户"] },
      { name: "告警误报率 FPR", category: "finance", categoryName: "金融通用", icon: "🏛️", desc: "反洗钱交易监控告警中被判定为无效的比例，是规则调优的核心指标。", formula: "告警误报率 = 无效告警数 ÷ 总告警数 × 100%", tags: ["合规指标", "风控指标"], scene: ["合规", "风控"] },
      { name: "额度使用率", category: "banking", categoryName: "银行", icon: "🏦", desc: "已用授信额度占总授信额度的比例，反映客户杠杆水平与潜在敞口。", formula: "额度使用率 = 已用额度 ÷ 已批授信额度 × 100%", tags: ["风控指标", "额度管理"], scene: ["风控", "支付"] },
      { name: "赎回率", category: "securities", categoryName: "证券与资管", icon: "📈", desc: "理财产品当期被赎回金额占产品规模的比例，反映资金稳定性与产品竞争力。", formula: "赎回率 = 当期赎回金额 ÷ 期初产品规模 × 100%", tags: ["运营指标", "留存指标"], scene: ["资管", "财富"] },
      { name: "风险敞口", category: "banking", categoryName: "银行", icon: "🏦", desc: "在信用、市场、操作等风险下可能发生损失的资产总额，需按产品与交易对手分层统计。", formula: "风险敞口 = 表内余额 + 表外敞口 × 信用转换系数 CCF", tags: ["风控指标", "核心指标"], scene: ["风控", "银行"] },
      { name: "风险加权资产 RWA", category: "banking", categoryName: "银行", icon: "🏦", desc: "按监管风险权重加权后的资产规模，是资本充足率的分母，变动需拆为规模/结构/方法三因子。", formula: "RWA = 信用风险 RWA + 市场风险 RWA + 操作风险 RWA", tags: ["资本指标", "监管指标"], scene: ["银行", "合规"] },
      // ===== 金融：信用风险量化与模型评估补齐 =====
      { name: "PD 违约概率", category: "banking", categoryName: "银行", icon: "🏦", desc: "借款人在观察期内发生违约的概率，是信贷定价、拨备与资本计量的基础参数。", formula: "PD = 观察期内违约客户数 ÷ 期初正常客户数 × 100%", tags: ["风控指标", "信用风险", "核心指标"], scene: ["风控", "模型"] },
      { name: "LGD 违约损失率", category: "banking", categoryName: "银行", icon: "🏦", desc: "违约发生后最终无法收回的敞口比例，受抵押品、清偿顺序与清收周期影响。", formula: "LGD = 1 − 回收率 = 损失金额 ÷ 违约敞口 EAD", tags: ["风控指标", "信用风险"], scene: ["风控", "模型"] },
      { name: "EAD 违约风险敞口", category: "banking", categoryName: "银行", icon: "🏦", desc: "违约时点未偿还的总额度，含已用额度与已批未用额度按信用转换系数折算部分。", formula: "EAD = 表内余额 + 表外敞口 × CCF", tags: ["风控指标", "信用风险"], scene: ["风控", "模型"] },
      { name: "ECL 预期信用损失", category: "banking", categoryName: "银行", icon: "🏦", desc: "IFRS 9 下的减值计提基础，分 12 个月 ECL 与全周期 ECL，按信用风险三阶段计量。", formula: "ECL = Σ (PD × LGD × EAD × 折现因子)", tags: ["监管指标", "减值", "核心指标"], scene: ["风控", "合规", "银行"] },
      { name: "迁徙率", category: "banking", categoryName: "银行", icon: "🏦", desc: "不同逾期阶段之间客户迁移的比例，用于预测未来不良生成与拨备需求。", formula: "迁徙率 = 本期迁移至下一阶段的金额 ÷ 上期该阶段金额 × 100%", tags: ["风控指标", "资产质量"], scene: ["风控", "银行"] },
      { name: "Vintage 账龄逾期率", category: "banking", categoryName: "银行", icon: "🏦", desc: "按放款月份分群、按账龄观察逾期率曲线，剥离客群与时间混杂效应。", formula: "账龄逾期率 = 第 n 期逾期余额 ÷ 该批次放款金额 × 100%", tags: ["风控指标", "资产质量"], scene: ["风控", "模型"] },
      { name: "WOE 证据权重", category: "banking", categoryName: "银行", icon: "🏦", desc: "变量分箱后好坏样本占比的对数比，将连续变量转为单调编码，提升逻辑回归可解释性。", formula: "WOE = ln(坏样本占比 ÷ 好样本占比)", tags: ["模型指标", "特征工程"], scene: ["模型", "风控"] },
      { name: "IV 信息值", category: "banking", categoryName: "银行", icon: "🏦", desc: "衡量特征预测力的筛选标准：<0.02 无用、0.1–0.3 中等、>0.5 需警惕信息泄漏。", formula: "IV = Σ (坏占比 − 好占比) × WOE", tags: ["模型指标", "特征工程"], scene: ["模型", "风控"] },
      { name: "KS 统计量", category: "banking", categoryName: "银行", icon: "🏦", desc: "评分卡分数的最大区分能力，风控常用门槛 KS > 0.3，需与 AUC 结合判断。", formula: "KS = max|累计好样本% − 累计坏样本%|", tags: ["模型指标", "区分能力"], scene: ["模型", "风控"] },
      { name: "AUC", category: "banking", categoryName: "银行", icon: "🏦", desc: "ROC 曲线下面积，衡量模型整体排序能力；0.5 为随机，0.7 以上为较好。", formula: "AUC = ∫ ROC 曲线下方面积", tags: ["模型指标", "区分能力"], scene: ["模型", "风控"] },
      { name: "Gini 系数", category: "banking", categoryName: "银行", icon: "🏦", desc: "由 AUC 换算的区分能力指标，常用于与国际同业评分卡对标。", formula: "Gini = 2 × AUC − 1", tags: ["模型指标", "区分能力"], scene: ["模型", "风控"] },
      { name: "PSI 群体稳定性指数", category: "banking", categoryName: "银行", icon: "🏦", desc: "监控分数分布随时间漂移：<0.1 稳定、0.1–0.25 关注、>0.25 预警并排查。", formula: "PSI = Σ (实际占比 − 预期占比) × ln(实际 ÷ 预期)", tags: ["模型指标", "模型监控"], scene: ["模型"] },
      { name: "CSI 特征稳定性指数", category: "banking", categoryName: "银行", icon: "🏦", desc: "逐特征做稳定性监控，用于定位发生漂移的具体入模变量。", formula: "CSI = Σ (当期占比 − 基准占比) × ln(当期 ÷ 基准)", tags: ["模型指标", "模型监控"], scene: ["模型"] },
      // ===== 金融：资本、流动性与合规补齐 =====
      { name: "CET1 核心一级资本充足率", category: "banking", categoryName: "银行", icon: "🏦", desc: "Basel III 最核心的资本监管指标，含最低要求、储备资本、逆周期缓冲与 D-SIB 附加资本。", formula: "CET1 比率 = 核心一级资本 ÷ 风险加权资产 RWA × 100%", tags: ["监管指标", "资本指标", "核心指标"], scene: ["银行", "合规"] },
      { name: "资本充足率 CAR", category: "banking", categoryName: "银行", icon: "🏦", desc: "总监管资本对风险加权资产的比率，覆盖信用、市场、操作三类风险。", formula: "CAR = 总监管资本 ÷ RWA × 100%", tags: ["监管指标", "资本指标"], scene: ["银行", "合规"] },

      { id: 'supply', name: '供应链履约', icon: '📦' },
      { id: 'risk', name: '风控合规', icon: '🛡️' }
    ];
    var ROLE_MAP = {};
    ROLE_DEFS.forEach(function (r) { ROLE_MAP[r.id] = r; });

    // 名称级覆盖：主分类仍用 category；这里补职能 + 逻辑标签
    var METRIC_CLASS_OVERRIDES = {
      '退货率': { roles: ['cost', 'quality'], logicTags: ['#成本强相关', '#质量相关'] },
      '拒收率': { roles: ['cost', 'quality', 'supply'], logicTags: ['#成本强相关', '#履约相关'] },
      '取消率': { roles: ['ops', 'revenue'], logicTags: ['#转化相关', '#收入相关'] },
      '补贴率': { roles: ['cost', 'growth'], logicTags: ['#成本强相关', '#增长杠杆'] },
      '物流费用率': { roles: ['cost', 'supply'], logicTags: ['#成本强相关', '#履约相关'] },
      '单件物流成本': { roles: ['cost', 'supply'], logicTags: ['#成本强相关'] },
      '吨公里成本': { roles: ['cost', 'supply'], logicTags: ['#成本强相关'] },
      'CAC（获客成本）': { roles: ['cost', 'growth'], logicTags: ['#成本强相关', '#增长杠杆'] },
      'CAC（客户获取成本）': { roles: ['cost', 'growth'], logicTags: ['#成本强相关', '#增长杠杆'] },
      'CAC 回收期': { roles: ['cost', 'growth'], logicTags: ['#成本强相关', '#效率核心'] },
      '制造成本': { roles: ['cost'], logicTags: ['#成本强相关'] },
      '差评率': { roles: ['quality', 'cost'], logicTags: ['#质量相关', '#成本相关'] },
      '呆滞库存占比': { roles: ['cost', 'supply'], logicTags: ['#成本强相关', '#库存相关'] },
      '缺货率': { roles: ['supply', 'revenue'], logicTags: ['#库存相关', '#收入相关'] },
      '返程空驶率': { roles: ['cost', 'ops'], logicTags: ['#成本强相关', '#效率核心'] }
    };

    function uniq(arr) {
      var seen = {}, out = [];
      (arr || []).forEach(function (x) {
        if (!x || seen[x]) return;
        seen[x] = true;
        out.push(x);
      });
      return out;
    }

    function inferMetricClass(m) {
      var blob = [m.name, m.desc, m.formula].concat(m.tags || []).join(' ');
      var roles = [];
      var logic = [];

      function hit(re) { return re.test(blob); }
      function addRole(id) { if (roles.indexOf(id) < 0) roles.push(id); }
      function addLogic(tag) { if (logic.indexOf(tag) < 0) logic.push(tag); }

      if (hit(/成本|费用|CAC|ROI|ROAS|补贴|毛利|净利|抽佣|Take Rate|损耗|退货|拒收|空驶|获客成本/)) {
        addRole('cost'); addLogic('#成本强相关');
      }
      if (hit(/增长|获客|渗透|分享|线索|投放|投流|营销|CTR|曝光|新增/)) {
        addRole('growth'); addLogic('#增长杠杆');
      }
      if (hit(/GMV|销售额|收入|营收|客单价|ARPU|ARPPU|ASP|RevPAR|成交|支付成功|赢单/)) {
        addRole('revenue'); addLogic('#收入核心');
      }
      if (hit(/留存|复购|活跃|RFM|LTV|粘性|NPS|会员|DAU|MAU/)) {
        addRole('user'); addLogic('#留存相关');
      }
      if (hit(/效率|运营|坪效|人效|动销|打开率|频次|转化|漏斗|跳出/)) {
        addRole('ops'); addLogic('#效率核心');
      }
      if (hit(/质量|体验|满意|差评|破损|准确率|SLA|CSAT|真实性/)) {
        addRole('quality'); addLogic('#体验核心');
      }
      if (hit(/库存|仓储|运输|物流|履约|配送|供应链|发货|OTD|拣货|库容|准时/)) {
        addRole('supply'); addLogic('#履约相关');
      }
      if (hit(/风控|合规|欺诈|坏账|逾期|拒付|风险|反作弊/)) {
        addRole('risk'); addLogic('#风控相关');
      }
      if (hit(/转化/)) addLogic('#转化相关');
      if (hit(/库存|售罄|动销|缺货|呆滞/)) addLogic('#库存相关');

      (m.tags || []).forEach(function (t) {
        if (t.indexOf('成本') >= 0) { addRole('cost'); addLogic('#成本强相关'); }
        if (t.indexOf('增长') >= 0) { addRole('growth'); addLogic('#增长杠杆'); }
        if (t.indexOf('收入') >= 0 || t.indexOf('销售') >= 0) { addRole('revenue'); addLogic('#收入核心'); }
        if (t.indexOf('留存') >= 0 || t.indexOf('用户') >= 0 || t.indexOf('会员') >= 0) { addRole('user'); addLogic('#留存相关'); }
        if (t.indexOf('效率') >= 0 || t.indexOf('运营') >= 0) { addRole('ops'); addLogic('#效率核心'); }
        if (t.indexOf('质量') >= 0 || t.indexOf('体验') >= 0 || t.indexOf('服务') >= 0) { addRole('quality'); addLogic('#体验核心'); }
        if (t.indexOf('库存') >= 0 || t.indexOf('仓储') >= 0 || t.indexOf('运输') >= 0 || t.indexOf('供应链') >= 0 || t.indexOf('物流') >= 0 || t.indexOf('配送') >= 0) {
          addRole('supply'); addLogic('#履约相关');
        }
        if (t.indexOf('风控') >= 0) { addRole('risk'); addLogic('#风控相关'); }
        if (t.indexOf('转化') >= 0) { addRole('ops'); addLogic('#转化相关'); }
        if (t.indexOf('营销') >= 0 || t.indexOf('投流') >= 0) { addRole('growth'); addLogic('#增长杠杆'); }
        if (t.indexOf('盈利') >= 0 || t.indexOf('财务') >= 0) { addRole('cost'); addLogic('#成本强相关'); }
      });

      var ov = METRIC_CLASS_OVERRIDES[m.name];
      if (ov) {
        if (ov.roles) roles = ov.roles.slice();
        if (ov.logicTags) logic = ov.logicTags.slice();
      }
      if (m.roles && m.roles.length) roles = m.roles.slice();
      if (m.logicTags && m.logicTags.length) logic = m.logicTags.slice();

      if (!roles.length) { addRole('ops'); addLogic('#效率核心'); }
      return { roles: uniq(roles), logicTags: uniq(logic) };
    }

    metrics.forEach(function (m) {
      var cls = inferMetricClass(m);
      m.roles = cls.roles;
      m.logicTags = cls.logicTags;
      m.primaryRole = cls.roles[0];
    });

    // 当前筛选状态（默认「通用」，不再提供与通用重复的「全部」）
    let currentCategory = 'general';
    let currentRole = 'growth';
    let browseMode = 'industry'; // industry | role
    let currentSearch = '';

    function renderRoleTags() {
      var el = document.getElementById('roleTags');
      el.innerHTML = ROLE_DEFS.map(function (r) {
        var cnt = metrics.filter(function (m) { return m.roles.indexOf(r.id) >= 0; }).length;
        var on = currentRole === r.id ? ' active' : '';
        return '<span class="filter-tag' + on + '" data-role="' + r.id + '">' + r.icon + ' ' + r.name +
          ' <small style="opacity:.7">(' + cnt + ')</small></span>';
      }).join('');
    }
    renderRoleTags();

    function setBrowseMode(mode) {
      browseMode = mode === 'role' ? 'role' : 'industry';
      document.querySelectorAll('.browse-mode-btn').forEach(function (b) {
        var on = b.getAttribute('data-mode') === browseMode;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      document.getElementById('filterTags').style.display = browseMode === 'industry' ? 'flex' : 'none';
      document.getElementById('roleTags').style.display = browseMode === 'role' ? 'flex' : 'none';
      renderMetrics();
    }

    document.getElementById('browseMode').addEventListener('click', function (e) {
      var btn = e.target.closest('.browse-mode-btn');
      if (!btn) return;
      setBrowseMode(btn.getAttribute('data-mode'));
    });

    document.getElementById('roleTags').addEventListener('click', function (e) {
      var tag = e.target.closest('.filter-tag');
      if (!tag) return;
      var role = tag.getAttribute('data-role');
      if (!role) return;
      currentRole = role;
      document.querySelectorAll('#roleTags .filter-tag').forEach(function (t) {
        t.classList.toggle('active', t === tag);
      });
      renderMetrics();
    });

    function findKgMetricNode(name, category) {
      var DATA = window.KNOWLEDGE_GRAPH_DATA;
      if (!DATA || !DATA.nodes) return null;
      var exact = DATA.nodes.find(function (n) {
        return n.type === 'metric' && !n.isRoot && !n.isCategory &&
          n.name === name && n.category === category;
      });
      if (exact) return exact;
      return DATA.nodes.find(function (n) {
        return n.type === 'metric' && !n.isRoot && !n.isCategory && n.name === name;
      }) || null;
    }

    function findKgNodeId(name, category) {
      var n = findKgMetricNode(name, category);
      return n ? n.id : null;
    }

    function getMetricDetail(metric) {
      var DATA = window.KNOWLEDGE_GRAPH_DATA;
      var byId = {};
      var problems = [];
      var methods = [];
      var seenP = {}, seenM = {};
      if (DATA && DATA.nodes) {
        DATA.nodes.forEach(function (n) { byId[n.id] = n; });
        var node = findKgMetricNode(metric.name, metric.category);
        function addProblem(n) {
          if (!n || seenP[n.id]) return;
          seenP[n.id] = true;
          problems.push(n.name);
        }
        function addMethod(n) {
          if (!n || seenM[n.id]) return;
          seenM[n.id] = true;
          methods.push(n.name);
        }
        if (node) {
          (node.crossRefs || []).forEach(function (id) {
            var n = byId[id];
            if (!n) return;
            if (n.type === 'business_problem') addProblem(n);
            if (n.type === 'methodology') addMethod(n);
          });
          // 反向：业务问题/方法里提到该指标的也纳入
          DATA.nodes.forEach(function (n) {
            if (n.isRoot || n.isCategory) return;
            var refs = n.crossRefs || [];
            if (refs.indexOf(node.id) < 0) return;
            if (n.type === 'business_problem') addProblem(n);
            if (n.type === 'methodology') addMethod(n);
          });
        }
      }
      if (!problems.length) {
        problems = [
          '监控「' + metric.name + '」异常波动，定位业务表现变化',
          '结合公式拆解驱动因子，找到可干预环节',
          '用于阶段复盘与目标拆解，对齐团队关注点'
        ];
      }
      if (!methods.length) {
        methods = (metric.tags || []).slice(0, 3);
      }
      return { problems: problems.slice(0, 5), methods: methods.slice(0, 6) };
    }

    function askJumpToGraph(metric) {
      var existing = document.getElementById('kgAskMask');
      if (existing) existing.remove();

      var mask = document.createElement('div');
      mask.id = 'kgAskMask';
      mask.className = 'kg-ask-mask';
      mask.innerHTML =
        '<div class="kg-ask-dialog" role="dialog" aria-modal="true">' +
        '  <h3>跳转到知识图谱？</h3>' +
        '  <p>是否打开「<strong>' + metric.name.replace(/</g, '&lt;') + '</strong>」的辐射关联图，查看相关业务问题与分析方法？</p>' +
        '  <div class="kg-ask-actions">' +
        '    <button type="button" class="kg-ask-cancel">取消</button>' +
        '    <button type="button" class="kg-ask-go">跳转辐射图</button>' +
        '  </div>' +
        '</div>';
      document.body.appendChild(mask);

      function close() { mask.remove(); }
      mask.querySelector('.kg-ask-cancel').addEventListener('click', close);
      mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
      mask.querySelector('.kg-ask-go').addEventListener('click', function () {
        var nodeId = findKgNodeId(metric.name, metric.category);
        var url = 'knowledge-graph.html?module=metric';
        if (nodeId) {
          url += '&node=' + encodeURIComponent(nodeId);
        } else {
          url += '&q=' + encodeURIComponent(metric.name);
        }
        if (metric.category) url += '&industry=' + encodeURIComponent(metric.category);
        window.location.href = url;
      });
    }

    // 初始化（script在页面底部，DOM已加载，直接执行）
    // 设置总数
    document.getElementById('totalMetrics').textContent = metrics.length;
    
    // 渲染指标
    renderMetrics();
    
    // 绑定搜索
    document.getElementById('searchInput').addEventListener('input', function(e) {
      currentSearch = e.target.value.trim().toLowerCase();
      renderMetrics();
    });
    
    // 绑定导航搜索
    var navSearchEl = document.getElementById('navSearch') ||
      document.querySelector('.nav-search input');
    if (navSearchEl) {
      if (!navSearchEl.id) navSearchEl.id = 'navSearch';
      navSearchEl.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          document.getElementById('searchInput').value = this.value;
          currentSearch = this.value.trim().toLowerCase();
          renderMetrics();
          // 移动端避免 focus 触发视口缩放/滚动错位
          if (window.matchMedia('(min-width: 769px)').matches) {
            document.getElementById('searchInput').focus();
          }
        }
      });
    }
    // 绑定筛选标签（事件委托，确保行业筛选生效）
    document.getElementById('filterTags').addEventListener('click', function (e) {
      var tag = e.target.closest('.filter-tag');
      if (!tag || !document.getElementById('filterTags').contains(tag)) return;
      var cat = tag.getAttribute('data-category');
      if (!cat) return;
      document.querySelectorAll('#filterTags .filter-tag').forEach(function (t) {
        t.classList.toggle('active', t === tag);
      });
      currentCategory = cat;
      renderMetrics();
    });
    
    // 从URL获取搜索词 / 行业 / 职能
    const urlParams = new URLSearchParams(window.location.search);
    const q = urlParams.get('q');
    const catParam = urlParams.get('category') || urlParams.get('industry');
    const modeParam = urlParams.get('mode');
    const roleParam = urlParams.get('role');
    var deepLinkSearch = false;
    if (catParam) {
      currentCategory = catParam;
      document.querySelectorAll('#filterTags .filter-tag').forEach(function (t) {
        t.classList.toggle('active', t.getAttribute('data-category') === catParam);
      });
    }
    if (roleParam && ROLE_MAP[roleParam]) {
      currentRole = roleParam;
      document.querySelectorAll('#roleTags .filter-tag').forEach(function (t) {
        t.classList.toggle('active', t.getAttribute('data-role') === roleParam);
      });
    }
    if (q) {
      document.getElementById('searchInput').value = q;
      currentSearch = q.toLowerCase();
      deepLinkSearch = true;
    }
    if (modeParam === 'role') setBrowseMode('role');
    else renderMetrics();
    if (window.idleLoadKgData) {
      window.idleLoadKgData(function () { renderMetrics(); });
    }

    function textMatchesMetric(m, search) {
      if (!search) return true;
      var hay = (
        m.name + ' ' + m.desc + ' ' + m.formula + ' ' +
        (m.tags || []).join(' ') + ' ' +
        (m.logicTags || []).join(' ') + ' ' +
        (m.scene || []).join(' ') + ' ' +
        m.categoryName
      ).toLowerCase();
      var n = String(search).toLowerCase().trim();
      if (!n) return true;
      if (hay.indexOf(n) >= 0) return true;
      var tokens = n.split(/\s+/).filter(Boolean);
      if (tokens.length > 1 && tokens.every(function (t) { return hay.indexOf(t) >= 0; })) return true;
      // 去语气词 / 连接词后再比
      var strip = /[怎么如何做的呢吗？?\s、，,。！!与和／/]/g;
      var h2 = hay.replace(strip, '');
      var n2 = n.replace(strip, '');
      if (n2 && h2.indexOf(n2) >= 0) return true;
      // 「净息差与定价」→ 先试左侧核心词
      var left = n.split(/[与和／/\s]/).filter(Boolean)[0] || '';
      if (left.length >= 2 && hay.indexOf(left) >= 0) return true;
      // 中文连续 2 字片段命中过半
      if (/[\u4e00-\u9fff]/.test(n) && n.length >= 4) {
        var parts = [];
        for (var i = 0; i < n.length - 1; i++) parts.push(n.substr(i, 2));
        var hit = 0;
        for (var j = 0; j < parts.length; j++) {
          if (hay.indexOf(parts[j]) >= 0) hit++;
        }
        if (hit >= Math.ceil(parts.length * 0.6)) return true;
      }
      return false;
    }

    // 渲染指标
    function renderMetrics() {
      const container = document.getElementById('metricsContainer');
      const emptyState = document.getElementById('emptyState');
      var broadenNote = '';

      function filterByScope(scopeMode) {
        return metrics.filter(function (m) {
          var matchScope;
          if (browseMode === 'role') {
            matchScope = (m.roles || []).indexOf(currentRole) >= 0;
          } else if (scopeMode === 'industry+general') {
            matchScope = m.category === currentCategory || m.category === 'general';
          } else if (scopeMode === 'all') {
            matchScope = true;
          } else {
            matchScope = m.category === currentCategory;
          }
          return matchScope && textMatchesMetric(m, currentSearch);
        });
      }

      // 有搜索词时：先「当前行业+通用」，仍空再搜全库（知识框架深链常见）
      var filtered;
      if (browseMode === 'role') {
        filtered = filterByScope('strict');
      } else if (currentSearch) {
        filtered = filterByScope('industry+general');
        if (filtered.length === 0) {
          filtered = filterByScope('all');
          if (filtered.length > 0) {
            broadenNote =
              '<p class="fw-broaden-note">在「当前行业 + 通用」未精确命中「' +
              String(document.getElementById('searchInput').value || currentSearch).replace(/</g, '&lt;') +
              '」，已展示全库相关指标</p>';
          }
        } else if (deepLinkSearch || currentCategory !== 'general') {
          var hasOther = filtered.some(function (m) { return m.category === 'general' && currentCategory !== 'general'; });
          if (hasOther) {
            broadenNote =
              '<p class="fw-broaden-note">已同时展示「通用」类相关指标（部分框架指标收录在通用分类）</p>';
          }
        }
        // 关键词仍无命中（框架页指标名未收录字典）：清空搜索，回落到当前行业，避免空白页
        if (filtered.length === 0) {
          var failedQ = String(document.getElementById('searchInput').value || currentSearch);
          currentSearch = '';
          document.getElementById('searchInput').value = '';
          deepLinkSearch = false;
          filtered = filterByScope('strict');
          if (filtered.length === 0) filtered = filterByScope('all');
          if (filtered.length > 0) {
            broadenNote =
              '<p class="fw-broaden-note">未找到与「' +
              failedQ.replace(/</g, '&lt;') +
              '」匹配的指标，已展示当前分类下全部指标</p>';
          }
        }
      } else {
        filtered = filterByScope('strict');
      }
      
      // 空状态
      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      
      // 分组始终按主分类（物理归属）；职能模式靠顶部 Tab 切换逻辑维度
      const grouped = {};
      filtered.forEach(m => {
        if (!grouped[m.categoryName]) {
          grouped[m.categoryName] = { icon: m.icon, items: [] };
        }
        grouped[m.categoryName].items.push(m);
      });

      var roleHint = '';
      if (browseMode === 'role' && ROLE_MAP[currentRole]) {
        roleHint =
          '<p style="margin:-8px 0 20px;font-size:13px;color:var(--text-muted)">' +
          ROLE_MAP[currentRole].icon + ' 当前职能：<strong style="color:var(--accent)">' +
          ROLE_MAP[currentRole].name +
          '</strong> · 卡片上的 #标签 为逻辑关联，主分类为行业物理归属</p>';
      }
      
      // 渲染
      let html = broadenNote + roleHint;
      for (const [catName, catData] of Object.entries(grouped)) {
        html += `
          <div class="category-section">
            <h2 class="category-title">
              <span class="icon">${catData.icon}</span>
              主分类 · ${catName}
              <span class="count">${catData.items.length} 个指标</span>
            </h2>
            <div class="metrics-grid">
              ${catData.items.map(m => renderMetricCard(m)).join('')}
            </div>
          </div>
        `;
      }
      
      container.innerHTML = html;

      container.querySelectorAll('.metric-flip').forEach(function (card) {
        var name = card.getAttribute('data-name');
        var cat = card.getAttribute('data-category');
        var m = filtered.find(function (x) {
          return x.name === name && x.category === cat;
        });

        card.querySelectorAll('.metric-flip-btn').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            card.classList.toggle('is-flipped');
          });
        });

        var front = card.querySelector('.metric-face-front');
        if (front) {
          front.addEventListener('click', function (e) {
            if (e.target.closest('.metric-flip-btn') || e.target.closest('.metric-scene')) return;
            if (m) askJumpToGraph(m);
          });
        }

        // 场景标签：点击按该场景速查（并自动切换到指标所属主分类）
        card.querySelectorAll('.metric-scene').forEach(function (sceneEl) {
          sceneEl.addEventListener('click', function (e) {
            e.stopPropagation();
            e.preventDefault();
            var scene = sceneEl.getAttribute('data-scene') || '';
            if (!scene) return;
            var cat = card.getAttribute('data-category');
            if (browseMode !== 'industry') {
              setBrowseMode('industry');
            }
            if (cat && currentCategory !== cat) {
              currentCategory = cat;
              document.querySelectorAll('#filterTags .filter-tag').forEach(function (t) {
                t.classList.toggle('active', t.getAttribute('data-category') === cat);
              });
            }
            var input = document.getElementById('searchInput');
            if (input) input.value = scene;
            currentSearch = scene.trim().toLowerCase();
            renderMetrics();
            var top = document.getElementById('metricsContainer');
            if (top) top.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });

        var kgBtn = card.querySelector('.metric-back-kg');
        if (kgBtn) {
          kgBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (m) askJumpToGraph(m);
          });
        }
      });
    }

    // 渲染单个指标卡片（正反面）
    function renderMetricCard(metric) {
      const highlight = (text) => {
        if (!currentSearch) return text;
        const regex = new RegExp(`(${currentSearch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<span class="highlight">$1</span>');
      };
      
      const tagColors = ['', 'purple', 'green', 'yellow'];
      const safeName = String(metric.name)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;');
      const detail = getMetricDetail(metric);
      const problemLis = detail.problems.map(function (p) {
        return '<li>' + highlight(String(p).replace(/</g, '&lt;')) + '</li>';
      }).join('');
      const methodChips = detail.methods.map(function (x) {
        return '<span>' + String(x).replace(/</g, '&lt;') + '</span>';
      }).join('');
      const logicTags = metric.logicTags || [];
      const logicHtml = logicTags.map(function (t) {
        var cls = 'metric-logic';
        if (t.indexOf('成本') >= 0) cls += ' is-cost';
        else if (t.indexOf('增长') >= 0) cls += ' is-growth';
        else if (t.indexOf('收入') >= 0) cls += ' is-revenue';
        return '<span class="' + cls + '" title="标签分类（逻辑关联）">' + highlight(String(t).replace(/</g, '&lt;')) + '</span>';
      }).join('');
      const roleHtml = (metric.roles || []).map(function (id) {
        var r = ROLE_MAP[id];
        return r ? '<span class="metric-role-chip" title="职能">' + r.name + '</span>' : '';
      }).join('');

      return `
        <div class="metric-flip" data-name="${safeName}" data-category="${metric.category}">
          <div class="metric-flip-inner">
            <div class="card metric-face metric-face-front">
              <div class="metric-header">
                <h3 class="metric-name">${highlight(metric.name)}</h3>
                <span class="metric-category" title="主分类（物理归属）"><span class="cat-label">主分类 ·</span>${metric.categoryName}</span>
              </div>
              <div class="metric-logic-tags">${logicHtml}${roleHtml}</div>
              <p class="metric-desc">${highlight(metric.desc)}</p>
              <div class="metric-formula">${highlight(metric.formula)}</div>
              <div class="metric-tags">
                ${metric.tags.map((t, i) => `<span class="metric-tag ${tagColors[i % tagColors.length]}">${t}</span>`).join('')}
              </div>
              ${(metric.scene && metric.scene.length) ? `<div class="metric-tags" style="margin-top:8px;">
                ${metric.scene.map(s => `<span class="metric-tag metric-scene" data-scene="${String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')}" title="点击按该场景速查">${highlight(String(s).replace(/</g, '&lt;'))}</span>`).join('')}
              </div>` : ''}
              <div class="metric-card-hint">正面点击 → 知识图谱 · 右下角翻面看用途</div>
              <button type="button" class="metric-flip-btn" title="翻面查看详情" aria-label="翻面查看详情">↻</button>
            </div>
            <div class="card metric-face metric-face-back">
              <h3 class="metric-back-title">${highlight(metric.name)}</h3>
              <p class="metric-back-sub">主分类 · ${metric.categoryName}　${logicTags.join(' ')}</p>
              <div class="metric-back-sec">
                <h4>可用于解决</h4>
                <ul>${problemLis}</ul>
              </div>
              <div class="metric-back-sec">
                <h4>相关方法 / 标签</h4>
                <div class="metric-back-chips">${methodChips || '<span>暂无</span>'}</div>
              </div>
              <div class="metric-back-sec">
                <h4>口径提示</h4>
                <ul>
                  <li>${highlight(metric.formula)}</li>
                  <li>${highlight(metric.desc)}</li>
                </ul>
              </div>
              <div class="metric-back-actions">
                <button type="button" class="metric-back-kg">打开知识图谱辐射图</button>
              </div>
              <button type="button" class="metric-flip-btn" title="翻回正面" aria-label="翻回正面">↻</button>
            </div>
          </div>
        </div>
      `;
    }
  </script>
  
  
  <div id="kgPageMount" class="kg-embed" style="display:none;" data-module="metric"></div>
  <script src="kg-loader.js?v=13"></script>
  <script>
    window.bindKgViewSwitch("metric");
  </script>
<script src="common.js?v=12"></script>
</body>
</html>
